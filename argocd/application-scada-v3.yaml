# Application Argo CD de la v3. À appliquer une seule fois, à la main :
#
#   kubectl apply -f argocd/application-scada-v3.yaml
#
# Ensuite, c'est le dépôt qui fait foi : un push sur la branche scada-v3 déclenche
# la CI, qui publie l'image et épingle son tag dans manifests/frontend.yaml ; Argo
# détecte ce changement et redéploie.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fermentation-v3
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TimBenedet/MyFermentLab.git
    targetRevision: scada-v3
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
