# Gabarit nginx. Le Dockerfile le dépose dans /etc/nginx/templates/ : l'entrypoint
# officiel le passe à envsubst au démarrage du conteneur, ce qui y injecte
# ${HASS_URL} et ${HASS_TOKEN} — cette dernière venant d'un Secret Kubernetes.
# envsubst ne remplace que les variables présentes dans l'environnement, donc les
# variables nginx ($host, $uri, $remote_addr) traversent intactes.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers Home Assistant, exactement comme le fait le serveur de dev en
    # local (voir vite.config.ts) : le navigateur appelle /ha/... en same-origin,
    # nginx ajoute l'en-tête d'autorisation et relaie. Le jeton reste donc côté
    # serveur et n'apparaît jamais dans le JavaScript servi.
    location /ha/ {
        proxy_pass ${HASS_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "Bearer ${HASS_TOKEN}";
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
