name: Build & Push — Scada-opus-5.5

# Chaîne GitOps complète :
#   1. push sur scada-opus-5.5/  →  2. l'image est construite et publiée sur GHCR
#   →  3. le tag de l'image est écrit dans scada-opus-5.5/k8s/kustomization.yaml
#   →  4. ArgoCD voit ce nouveau commit et déploie.
# Le commit de l'étape 3 ne relance pas la CI (négation de chemin + [skip ci]).
#
# Le build utilise la commande docker CLI directement (et non docker/build-push-action) :
# c'est exactement la commande validée à la main sur le homelab, sans ambiguïté sur la
# résolution du contexte et du Dockerfile.

on:
  push:
    branches: [Scada-opus-5.5]
    paths:
      - 'scada-opus-5.5/**'
      # Les changements de manifestes ne nécessitent pas de rebuild : ArgoCD les applique
      # directement. (paths et paths-ignore ne peuvent pas coexister sur un même événement.)
      - '!scada-opus-5.5/k8s/**'
      - '!scada-opus-5.5/argocd/**'
      - '.github/workflows/build-scada-opus.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # pour committer la mise à jour du tag (GitOps write-back)
      packages: write    # pour publier l'image sur GHCR
    # Deux pushes rapprochés ne doivent pas se marcher dessus : on fait la queue.
    concurrency:
      group: scada-opus-deploy
      cancel-in-progress: false

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image et le tag
        id: meta
        run: |
          set -euo pipefail
          # GHCR refuse les majuscules dans le nom du dépôt : « TimBenedet » → « timbenedet ».
          # (docker/metadata-action le faisait pour build-frontend.yml ; ici la commande est
          # écrite à la main, donc la conversion est explicite.)
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=${owner}/myfermentlab-scada" >> "$GITHUB_OUTPUT"
          echo "tag=scada-opus-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Construire l'image
        working-directory: scada-opus-5.5
        run: |
          set -euo pipefail
          IMG="$REGISTRY/${{ steps.meta.outputs.image }}"
          docker build \
            --progress=plain \
            --file Dockerfile \
            --build-arg VERSION="${{ steps.meta.outputs.tag }}" \
            --tag "$IMG:${{ steps.meta.outputs.tag }}" \
            --tag "$IMG:latest" \
            .

      - name: Publier l'image sur GHCR
        run: |
          set -euo pipefail
          IMG="$REGISTRY/${{ steps.meta.outputs.image }}"
          docker push "$IMG:${{ steps.meta.outputs.tag }}"
          docker push "$IMG:latest"

      - name: Épingler le tag dans le manifeste (déclenche ArgoCD)
        if: github.ref == 'refs/heads/Scada-opus-5.5'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          FILE=scada-opus-5.5/k8s/kustomization.yaml

          if grep -qE "^\s*newTag: $TAG\s*$" "$FILE"; then
            echo "::notice::Le manifeste référence déjà $TAG, rien à faire."
            exit 0
          fi
          if ! grep -qE "^\s*newTag:" "$FILE"; then
            echo "::error::$FILE ne contient aucune ligne newTag à mettre à jour."
            exit 1
          fi

          sed -i -E "s|^(\s*newTag: ).*$|\1$TAG|" "$FILE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "::notice::Aucune modification du manifeste."
            exit 0
          fi

          git commit -m "chore(scada): déploie l'image $TAG [skip ci]"
          # La CI écrit sur la même branche que le poste local : on se remet à jour avant
          # de pousser, sinon un push local concurrent fait échouer le job.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice::Manifeste mis à jour vers $TAG — ArgoCD va synchroniser."

      - name: Résumé
        run: |
          {
            echo "### Scada-opus-5.5 déployé par GitOps"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$REGISTRY/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| ArgoCD | application \`scada-opus-5.5\` → namespace \`scada-opus\` |"
            echo "| Accès | http://192.168.1.51:30090/ · http://hakko.myfermentlab/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          echo "::error::Étape en échec. Pour reproduire en local :"
          echo "  cd scada-opus-5.5 && docker build --file Dockerfile --build-arg VERSION=dev -t test ."
          docker images | head -5 || true
