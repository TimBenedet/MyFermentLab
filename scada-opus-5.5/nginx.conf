# Configuration nginx du dashboard « Scada-opus-5.5 ».
# Destinée à /etc/nginx/conf.d/default.conf : ce fichier est inclus dans le
# contexte « http » (le map ci-dessous a donc le droit d'y vivre).

# Politique de cache calculée une fois par requête, à partir de l'URI :
#  - html / md / txt / json -> no-store : le dashboard doit toujours être frais ;
#  - images et polices       -> 30 jours (2592000 s) + immutable.
# Un seul add_header est posé (au niveau server), ce qui évite le piège de
# non-héritage des en-têtes dès qu'une location déclare son propre add_header.
map $uri $scada_cache_control {
    default                                              "no-store";
    ~*\.(png|jpe?g|gif|ico|webp|avif|svg|woff2?|ttf|eot)$ "public, max-age=2592000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    # charset_types : le paramètre charset n'est ajouté qu'aux types listés.
    # text/markdown n'en fait pas partie par défaut, or les .md du livrable
    # sont en UTF-8 : sans cette ligne, les accents s'affichent mal.
    charset_types text/html text/css text/xml text/plain text/markdown
                  application/javascript application/json;
    server_tokens off;   # pas de version nginx dans l'en-tête Server
    autoindex off;       # pas de listing de répertoire

    # En-têtes de sécurité sobres, appliqués aussi aux réponses d'erreur.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $scada_cache_control always;

    # Compression des ressources textuelles (le HTML est compressé d'office).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/markdown text/javascript
               application/javascript application/json
               image/svg+xml application/xml text/xml;

    # Sonde de santé : réponse constante, aucun accès disque.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Les .md doivent être AFFICHÉS par le navigateur, pas téléchargés :
    # d'où le type text/markdown. Un bloc « types » remplace la table MIME
    # héritée (mime.types), il est donc confiné à cette location qui ne
    # matche que des fichiers .md.
    location ~* \.md$ {
        types { text/markdown md markdown; }
        default_type text/markdown;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
