apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scada-opus-5.5
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: myfermentlab
  finalizers:
    # Supprimer l'Application supprime aussi ce qu'elle a créé (pas d'orphelins).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/TimBenedet/MyFermentLab.git
    # La branche que l'on pousse depuis le poste local.
    targetRevision: Scada-opus-5.5
    path: scada-opus-5.5/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: scada-opus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
