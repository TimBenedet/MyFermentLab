<!doctype html>
<html lang="fr" data-version="hk-1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakko — Supervision des fermentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* ---------- Vue téléphone ----------
   « vue-tel » : présentation téléphone forcée par le bouton (cadre de 430 px).
   « tactile » : cibles et champs agrandis, sous 900 px ou en vue forcée.
   Posées ici, avant la feuille de style, pour que la première image soit la bonne. */
const VUE_CLE = 'hakko-vue';
const HAKKO_VERSION = 'hk-1'; window.HAKKO_VERSION = HAKKO_VERSION;
const vueEtroite = matchMedia('(max-width: 900px)');
let vueForcee = false; try { vueForcee = localStorage.getItem(VUE_CLE) === 'tel'; } catch(e) {}
function appliquerVue(){
  const h = document.documentElement;
  h.classList.toggle('vue-tel', vueForcee);
  h.classList.toggle('tactile', vueForcee || vueEtroite.matches);
  const b = document.getElementById('vueBtn');
  if (b) b.setAttribute('aria-pressed', vueForcee ? 'true' : 'false');
}
function basculerVue(){
  vueForcee = !vueForcee;
  try { if (vueForcee) localStorage.setItem(VUE_CLE, 'tel'); else localStorage.removeItem(VUE_CLE); } catch(e) {}
  appliquerVue();
}
vueEtroite.addEventListener('change', appliquerVue);
appliquerVue();
</script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#F7F8FA; --hover:#F1F3F6;
  /* --muted : #6B7280 assombri de 8 % vers --ink (même teinte) pour passer AA sur --bg et --hover. */
  --ink:#111827; --ink2:#374151; --muted:#646B79; --faint:#9CA3AF;
  --line:#E5E7EB; --line2:#D1D5DB; --grid:#EEF0F3;
  --accent:#2350B8; --accent-soft:#EAF0FC;
  --ok:#15803D; --ok-bg:#E7F6EC; --warn:#B45309; --warn-bg:#FDF3E1; --bad:#B91C1C; --bad-bg:#FDECEC;
  --biere:#C98410; --miso:#95602F; --koji:#5A8A2E; --garum:#9B2C4A;
  --side:#151A21; --side-ink:#AEB6C2; --side-ink2:#F3F5F8; --side-active:#232A34; --side-line:#262D38;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A21; --surface2:#1A1F27; --hover:#1E242D;
    --ink:#E6EAF0; --ink2:#C4CAD3; --muted:#8C95A3; --faint:#6B7380;
    --line:#262C36; --line2:#323A46; --grid:#1F252E;
    --accent:#7FA2EC; --accent-soft:#1C2740;
    --ok:#5CC486; --ok-bg:#142A1D; --warn:#E8A955; --warn-bg:#2E2412; --bad:#F07F7F; --bad-bg:#321818;
    --biere:#E3A53A; --miso:#C98E5A; --koji:#8DBE5C; --garum:#D66E8A;
    --side:#0A0C10; --side-active:#1B2029; --side-line:#1C212A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface2:#1A1F27; --hover:#1E242D;
  --ink:#E6EAF0; --ink2:#C4CAD3; --muted:#8C95A3; --faint:#6B7380;
  --line:#262C36; --line2:#323A46; --grid:#1F252E;
  --accent:#7FA2EC; --accent-soft:#1C2740;
  --ok:#5CC486; --ok-bg:#142A1D; --warn:#E8A955; --warn-bg:#2E2412; --bad:#F07F7F; --bad-bg:#321818;
  --biere:#E3A53A; --miso:#C98E5A; --koji:#8DBE5C; --garum:#D66E8A;
  --side:#0A0C10; --side-active:#1B2029; --side-line:#1C212A;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
svg.i{width:16px;height:16px;flex:none}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;height:60px;padding:0 20px;color:var(--side-ink2);font-weight:600;font-size:15px;border-bottom:1px solid var(--side-line)}
.brand-mark{width:28px;height:28px;border-radius:7px;background:#F3F5F8;color:#151A21;display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);margin-top:-2px}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px}
/* Titres de section et compteurs : #6F7885 éclairci vers --side-ink (même teinte), AA sur la
   barre latérale comme sur le lien actif, dans les deux thèmes. */
.nav-sec{font-size:12px;color:#88919D;padding:14px 10px 6px}
.nav-sec:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-weight:500}
.nav a:hover{color:var(--side-ink2);background:rgba(255,255,255,.04)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-ink2)}
.nav a[aria-current="page"] svg{color:#8FB0F5}
.nav a .cnt{margin-left:auto;font-size:12px;color:#88919D}
.side-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--side-line);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.side-foot strong{color:var(--side-ink2);font-weight:500;display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:#34C06A;box-shadow:0 0 0 3px rgba(52,192,106,.18)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;height:60px;display:flex;align-items:center;gap:16px;padding:0 32px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--muted)}
.crumbs .cur{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
.sync{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.bare{border-color:transparent;background:none}
.content{padding:28px 32px 64px;width:100%}
.tabbar{display:none}
.m-brand{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:0 16px}
  .m-brand{display:grid}
  .sync-txt{display:none}
  .content{padding:20px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:500}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a[aria-current="page"]{color:var(--accent)}
}

/* ---------- Page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-size:22px;line-height:1.3}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1116}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:52px}
.card-h h2{font-size:14px}
.card-h .sub{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.card-b{padding:18px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
/* Texte du badge vert tiré de 10 % vers --ink : plus sombre en clair, plus clair en sombre. */
.badge.ok{background:var(--ok-bg);color:color-mix(in srgb,var(--ok) 90%,var(--ink));border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.type{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.type i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs button{border:0;background:none;height:44px;padding:0 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{margin-left:6px;font-size:12px;padding:1px 6px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 11px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar>div{height:100%;border-radius:3px;background:var(--c,var(--accent))}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi .s.ok{color:var(--ok)} .kpi .s.bad{color:var(--bad)} .kpi .s.warn{color:var(--warn)}

/* ---------- Overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:12px}
.lot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.lot:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(16,24,40,.06)}
.lot-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.lot-n{padding:6px 14px 0;font-weight:600;font-size:15px}
.lot-m{padding:2px 14px 0;color:var(--muted);font-size:12.5px}
.lot-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 14px 0;border:1px solid var(--line);border-radius:7px}
.lot-metrics>div{padding:8px 10px;border-left:1px solid var(--line)}
.lot-metrics>div:first-child{border-left:0}
.lot-metrics .k{font-size:11.5px;color:var(--muted)}
.lot-metrics .v{font-size:16px;font-weight:600}
.lot-metrics .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.spark{display:block;width:calc(100% - 28px);height:44px;margin:10px 14px 0}
.lot-f{padding:10px 14px 14px;margin-top:auto}
.lot-f .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 18px}
.feed .fi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.feed .fi svg{width:14px;height:14px}
.feed .fi.heat{color:var(--warn)} .feed .fi.note{color:var(--accent)} .feed .fi.batch{color:var(--ok)}
.feed .ft{font-size:13px;color:var(--ink2);line-height:1.4}
.feed .fm{font-size:12px;color:var(--muted)}
.side-stack{display:flex;flex-direction:column;gap:20px}
.health{list-style:none;margin:0;padding:6px 0}
.health li{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13px}
.health li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.health li .vl{color:var(--muted)}
@media (max-width:1180px){.ov{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--hover)}
table.data .r{text-align:right}
table.data .nm{font-weight:500;color:var(--ink)}
table.data .sm{font-size:12.5px;color:var(--muted)}
table.data select{height:30px;padding:0 8px;font-size:13px;max-width:210px}
.bat{display:flex;align-items:center;gap:8px}
.bat .bar{width:48px}
.dev-cell{display:flex;align-items:center;gap:10px}
.dev-ic{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.dev-ic svg{width:15px;height:15px}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:900px){
  table.data.stack thead{display:none}
  table.data.stack,table.data.stack tbody,table.data.stack tr{display:block}
  table.data.stack tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.data.stack tr:last-child{border-bottom:0}
  table.data.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:right}
  table.data.stack td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
  table.data.stack td.first{justify-content:flex-start;text-align:left;padding-bottom:8px}
  table.data.stack .ctl{justify-content:flex-end}
}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:0 1 280px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search input{padding-left:32px}
.toolbar .spacer{flex:1}

/* ---------- Inputs ---------- */
input[type=text],input[type=number],input[type=search],select,textarea{height:36px;background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:0 11px;width:100%;outline:none;box-shadow:var(--shadow)}
textarea{height:auto;min-height:88px;padding:9px 11px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:500;color:var(--ink2)}
.field>span em{font-style:normal;font-weight:400;color:var(--muted);margin-left:4px}
.field .unit{position:relative}
.field .unit input{padding-right:44px}
.field .unit b{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-weight:400;color:var(--muted);font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}

/* ---------- Detail ---------- */
.dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.dh h1{font-size:24px;line-height:1.25;margin-top:8px}
.dh .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh .sub{color:var(--muted);margin-top:4px}
.dh .sub a{color:var(--accent)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;margin-bottom:20px}
.dcol{display:flex;flex-direction:column;gap:20px}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .tip{position:absolute;top:-4px;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;transform:translateX(-50%)}
.chart svg text{font-family:inherit}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;background:var(--c)}
.legend i.dash{background:none;border-top:2px dashed var(--c);opacity:.7}
.legend i.band{height:10px;background:var(--c);opacity:.12}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;font-size:13.5px}
.kv dt{color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line)}
.kv dd{margin:0;text-align:right;padding:9px 0;border-bottom:1px solid var(--line);font-weight:500}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px}
.strip span{aspect-ratio:1;border-radius:2px;background:var(--grid)}
.strip span.past{background:var(--c)}
.strip span.now{background:var(--c);opacity:.45;outline:1.5px solid var(--c);outline-offset:1px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.prog-top strong{font-size:20px;font-weight:600}
.dates{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px}

/* ---------- Multiprise ---------- */

/* ===== Vue téléphone forcée (bouton) : cadre de 430 px et recopie des @media =====
   Chaque règle porte la valeur NETTE qu'obtient une fenêtre de 430 px après cascade.
   Rien ici ne s'applique sans la classe vue-tel. */
html.vue-tel{--cadre-tel:430px}
html.vue-tel body{max-width:var(--cadre-tel);margin:0 auto;box-shadow:0 0 0 1px var(--line)}
html.vue-tel dialog{width:min(calc(var(--cadre-tel) - 32px),calc(100vw - 32px))}

/* recopie de @media (max-width:900px), l. 89-100 : coquille */
html.vue-tel .app{grid-template-columns:1fr}
html.vue-tel .side{display:none}
html.vue-tel .topbar{padding:0 16px}
html.vue-tel .m-brand{display:grid}
html.vue-tel .sync-txt{display:none}

html.vue-tel .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:var(--cadre-tel);margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
html.vue-tel .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:500}

/* recopie de @media (max-width:900px), l. 209-218 : tableaux en fiches */
html.vue-tel table.data.stack thead{display:none}
html.vue-tel table.data.stack,html.vue-tel table.data.stack tbody,html.vue-tel table.data.stack tr{display:block}

html.vue-tel table.data.stack td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}

/* recopie de @media (max-width:1180px), l. 184 et l. 490 */

<script>
/* ---------- Utils ---------- */
const DAY = 864e5, HOUR = 36e5, HYST = 0.2;

   après 45 min de chauffe continue, 15 min de pause avant de pouvoir réarmer, et 5 min
   de silence après un refus du pont. */
const AUTO_COOLDOWN = 60e3, AUTO_MAX_ON = 45 * 60e3, AUTO_PAUSE = 15 * 60e3, AUTO_REFUS = 5 * 60e3;
/* Deux onglets du même navigateur ne régulent pas ensemble : ils prendraient la même
   décision, mais se contrediraient dès que l'un des deux a des données différentes
   (une consigne changée la veille). Le premier onglet garde la main tant qu'il bat. */
const REGUL_CLE = 'hakko-regul';
const regulId = Math.random().toString(36).slice(2, 8);
function regulMaitre(){
  const t = now();
  let vu = null; try { vu = JSON.parse(localStorage.getItem(REGUL_CLE) || 'null'); } catch(e){}
  if (vu && vu.id !== regulId && t - vu.t < 10000) return false;
  try { localStorage.setItem(REGUL_CLE, JSON.stringify({ id: regulId, t })); } catch(e){}
  return true;
}
const now = () => Date.now();
// Page ouverte directement (file://) : maquette pure, on ne tente aucune requête.
// Servie par le cluster, en revanche, l'état réel fait foi — et si le pont ne
// répond pas, le clic le dit au lieu de simuler une commande.
/* Déclarée ici, avant tout code exécuté au chargement (migrations, historique de
   démonstration) qui la lit : plus bas, elle serait en zone morte à ce moment-là. */
const PONT_LOCAL = location.protocol === 'file:';
const esc =s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => (n == null || isNaN(n)) ? '—' : Number(n).toFixed(d).replace('.', ',');
const fmtDate = t => new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const fmtDateY = t => new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
const fmtTime = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const uid = p => p + Math.random().toString(36).slice(2, 8);
function fmtDur(d){
  if (d < 3) return Math.round(d * 24) + ' h';
  if (d < 60) return Math.round(d) + ' jours';
  if (d >= 330){ const y = Math.round(d / 365); return y + (y > 1 ? ' ans' : ' an'); }
  return Math.round(d / 30) + ' mois';
}
function ago(t){
  /* Un appareil qui n'a jamais rien remonté n'a pas d'âge : « il y a NaN j » n'est pas une date. */
  if (t == null || isNaN(t)) return 'jamais';
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return 'il y a ' + s + ' s';
  if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';
  return 'il y a ' + Math.round(s / 86400) + ' j';
}
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295 * 100; }

/* ---------- Data ---------- */

function seed(){
  const t = now();
  const R = [

     ingredients:[{n:'Riz rond poli',q:'1 kg'},{n:'Spores Aspergillus oryzae',q:'1 g'},{n:'Farine de riz grillée',q:'10 g'}],
     steps:['Laver et tremper le riz 12 h, égoutter 1 h','Cuire à la vapeur 50 min','Refroidir à 35 °C et ensemencer','Incuber à 30 °C, humidité 85 %','Retourner à 18 h puis à 26 h','Récolter entre 44 et 48 h, avant sporulation']},
    {id:'r4', name:'Garum de champignons', type:'garum', duration:49, temp:60, salt:10, archived:false,
     desc:'Garum de champignons de Paris au koji, fermentation chaude.',

    {id:'r5', name:'IPA Citra', type:'biere', duration:14, temp:19, og:1.064, fg:1.012, volume:20, archived:true,
     desc:'IPA mono-houblon, dry hop massif en fin de fermentation.',

    {id:'r6', name:'Miso cacao-épeautre', type:'miso', duration:180, temp:20, salt:12, archived:true,
     desc:'Miso expérimental à l’épeautre et au grué de cacao.',

  const b1s = t - 9.3*DAY, b2s = t - 142*DAY, b3s = t - 26*HOUR, b4s = t - 20*DAY, b0s = t - 52*DAY;
  const B = [

    {id:'b3', name:'Koji de riz — amazake', recipe:snap('r3'), recipeId:'r3', start:b3s, status:'active',

    {id:'b4', name:'Garum de champignons', recipe:snap('r4'), recipeId:'r4', start:b4s, status:'active',
     notes:[{t:b4s,x:'Broyage champignons et koji, sel 10 %, étuve à 60 °C.'}]},
    {id:'b0', name:'IPA Citra #2', recipe:snap('r5'), recipeId:'r5', start:b0s, end:b0s+14*DAY, status:'done',
     gravity:[[b0s,1.064],[b0s+2*DAY,1.040],[b0s+5*DAY,1.018],[b0s+9*DAY,1.012],[b0s+13*DAY,1.011]],
     notes:[{t:b0s+7*DAY,x:'Dry hop 120 g Citra.'}]},

  /* Les trois prises reliées à un lot sont marquées « demo » : ce sont des liens de

  const D = [

  ];
  return {recipes:R, batches:B, devices:D};
}
let S = null;
try { S = JSON.parse(localStorage.getItem(STORE)); } catch(e) {}
if (!S || !S.recipes) S = seed();
/* Écriture de l'état. Un quota plein ne doit pas passer sous silence : c'est l'état de
   régulation (modes, consignes, chronomètres de sécurité) qui cesserait d'être conservé.
   On élague la mémoire des mesures, on retente, et si ça ne suffit pas on le dit. */
function save(){
  const ecrire = () => localStorage.setItem(STORE, JSON.stringify(S));
  try { ecrire(); return; } catch(e) {}
  /* On libère d'abord la plus grosse mémoire de mesures — la plus courte ne rendrait
     presque rien. L'alerte n'est écrite qu'une fois par incident : la répéter à chaque
     tentative toutes les 3 secondes remplirait le journal et en chasserait les vraies
     commandes, exactement l'effet qu'on veut éviter. */
  const cles = S.hist ? Object.keys(S.hist).sort((a, c) => S.hist[c].length - S.hist[a].length) : [];
  if (cles.length && S.hist[cles[0]].length > 4){
    const k = cles[0]; S.hist[k] = S.hist[k].slice(-Math.max(2, Math.floor(S.hist[k].length / 2)));
    try { ecrire(); alerteStockage('Mémoire des mesures élaguée : le stockage du navigateur est plein'); return; } catch(e) {}

       sont tracées : deux mesures anciennes ne sont pas présentées comme récentes.

       interrompt la vignette au lieu d'y tracer un trait droit. */
    decouper(histDe(b).filter(p => trace(p)[0] >= from)).forEach(sg => segs.push(sg.map(trace)));
  } else if (PONT_LOCAL){
    const m = [];

    segs.push(m);

}
function logEvent(k, x, b, extra){ S.events.unshift(Object.assign({t:now(), k, x, b}, extra || {})); bornerEvents(); }
function logHeat(d, b, tp, manual, t, sim, reel){
  const tg = b ? b.recipe.temp : null;
  const x = `${d.name} : ${d.on ? 'activation' : 'désactivation'} de la chauffe${tp != null ? ' à ' + fmt(tp, 1) + ' °C' : ''}${manual ? ' (manuel)' : ''}`;
  const e = {t:t || now(), k:d.on ? 'heat-on' : 'heat-off', x, b:b ? b.id : null, tp, tg, manual:!!manual, sim:!!sim, reel:!!reel};
  if (t){ S.events.push(e); } else { S.events.unshift(e); bornerEvents(); }
}
/* Historique de chauffe fabriqué pour la DÉMONSTRATION seulement (36 dernières heures).
   Il écrivait ses cycles pour tout lot ayant une prise reliée, y compris les vraies : un
   lot réel se retrouvait avec un journal de chauffes qui n'avaient pas eu lieu, aux
   températures du modèle et non de la sonde. Désormais il ne concerne que les prises
   marquées « demo », et ses événements portent le drapeau « sim » que le journal cache
   aux lots réels. */
/* Migration unique, indépendante du générateur de démonstration : un état déjà semé porte
   le même journal fabriqué, et le drapeau `heatSeeded` est déjà posé chez l'utilisateur.
   Les événements sont mis de côté plutôt que supprimés (S.eventsArchive) — leur provenance
   n'est pas vérifiable, et un lot réel ne doit pas afficher de chauffes qu'il n'a pas eues. */
if (!S.migrationSim){
  S.migrationSim = true;
  if (!S.eventsArchive) S.eventsArchive = [];
  /* « restaure » : un événement que l'utilisateur a lui-même fait revenir de la mise de côté
     n'y retourne jamais, même si cette migration devait être rejouée. */
  const douteux = S.events.filter(e => (e.k === 'heat-on' || e.k === 'heat-off') && e.tp != null && !e.sim && !e.reel && !e.restaure);
  if (douteux.length){
    S.eventsArchive = S.eventsArchive.concat(douteux);
    S.events = S.events.filter(e => douteux.indexOf(e) < 0);
    logEvent('note', douteux.length + ' événements de chauffe de provenance non vérifiable mis de côté'
      + ' (certains peuvent être de vraies commandes de régulation ; archive conservée)');
  }
}
if (!S.heatSeeded){
  S.events = S.events.filter(e => !((e.k === 'heat-on' || e.k === 'heat-off') && e.tp == null));
  const t1 = now();
  for (const b of S.batches.filter(x => x.status === 'active')){
    for (const d of S.devices.filter(x => x.kind === 'plug' && x.batch === b.id && x.demo === true)){
      let on = null;
      for (let t = Math.max(b.start, t1 - 36 * HOUR); t < t1 - 60e3; t += 4 * 60e3){
        const tp = model(b, t).temp, tg = b.recipe.temp;
        const nxt = tp < tg - HYST ? true : tp > tg + HYST ? false : on;
        /* L'historique fabriqué ne touche pas à l'état d'une vraie prise : hors maquette,
           son état est celui que le pont renverra, et un d.on inventé ici le ferait passer
           pour « changé hors du dashboard » à la première synchro. */
        if (on !== null && nxt !== on){ if (PONT_LOCAL) d.on = nxt; logHeat(Object.assign({}, d, {on:nxt}), b, tp, false, t, true); }
        on = nxt;
      }
    }
  }
  S.events.sort((a, c) => c.t - a.t);
  S.heatSeeded = true;
}
const EV_IC = {target:['note', IC.temp], 'heat-on':['heat', IC.flame], 'heat-off':['', IC.flame], note:['note', IC.pen], alert:['', IC.alert], batch:['batch', IC.play]};
/* Un événement simulé ne se lit que dans la page ouverte en local, où la simulation est le
   sujet. Même règle pour le journal d'un lot et pour le fil « Activité récente » — qui
   affichait encore, au nom d'un vrai relais, des chauffes du modèle qui n'ont pas eu lieu. */
const evVisible = e => !e.sim || PONT_LOCAL;
const activiteRecente = () => S.events.filter(evVisible).slice(0, 30);
/* Un événement restauré depuis la mise de côté garde sa marque dans le fil comme dans le
   journal du lot : sans elle, une chauffe fabriquée repasserait pour une vraie commande. */
function feedHTML(list){
  if (!list.length) return '<div class="empty">Aucune activité récente.</div>';
  return `<ul class="feed">${list.map(e => { const [c, i] = EV_IC[e.k] || ['', IC.pen]; return `<li><span class="fi ${c}" style="${e.k === 'alert' ? 'color:var(--bad)' : ''}">${i}</span><div><div class="ft">${esc(e.x)}${e.restaure ? ' <span class="muted">(restauré, provenance non vérifiée)</span>' : ''}</div><div class="fm">${ago(e.t)}</div></div></li>`; }).join('')}</ul>`;
}

/* ---------- Live values ---------- */
function live(key){
  const [k, id] = key.split(':');
  if (k === 'dev'){
    const d = S.devices.find(x => x.id === id); if (!d) return '';
    /* Une valeur non fraîche (jamais reçue du pont, ou il y a plus de dix minutes) s'affiche
       « — ». Une prise sans mesure de puissance (Meross) dit ON ou OFF, pas des watts. */
    if (!fraiche(d)) return '—';
    if (d.kind === 'plug') return typeof d.power === 'number' ? (d.on ? fmt(d.power, 0) + ' W' : '0 W') : (d.on ? 'ON' : 'OFF');
    return d.kind === 'hum' ? fmt(d.value, 1) + ' %' : fmt(d.value, 2) + ' °C';
  }
  if (k === 'seen'){ const d = S.devices.find(x => x.id === id); return !d ? '' : sansEntite(d) ? 'jamais' : ago(d.seen); }
  if (k === 'kpi'){ return kpiVal(id); }
  const b = S.batches.find(x => x.id === id); if (!b) return '';
  if (k === 'temp') return fmt(currentTemp(b), 1);
  if (k === 'hum') return fmt(currentHum(b), 0);
  if (k === 'heat'){ const c = chauffe(b); return c === 'on' ? 'Active' : c === 'off' ? 'Veille' : '—'; }
  if (k === 'delta'){
    const tp = currentTemp(b);
    if (tp == null){ const m = sansMesure(b); return !m ? 'Aucune sonde reliée' : m === 'Sonde hors ligne' ? 'Sonde hors ligne' : m === 'Sonde sans entité' ? 'Sonde sans entité Home Assistant' : 'Aucune mesure récente'; }
    const d = tp - b.recipe.temp;
    return `${d >= 0 ? '+' : '−'}${fmt(Math.abs(d), 1)} °C vs cible`;
  }
}
function kpiVal(k){
  const act = S.batches.filter(b => b.status === 'active');
  if (k === 'alerts') return String(act.filter(b => status(b)[0] === 'bad' || status(b)[0] === 'warn').length);
  /* « En ligne » : un appareil dont la page a une valeur fraîche, pas un drapeau resté vrai
     depuis le jeu de démonstration. */
  if (k === 'online') return `${S.devices.filter(fraiche).length}/${S.devices.length}`;
  if (k === 'heaters') return String(S.devices.filter(d => d.kind === 'plug' && d.on && fraiche(d)).length);
  if (k === 'power'){
    const ps = S.devices.filter(d => d.kind === 'plug' && fraiche(d));
    if (!ps.length || ps.some(d => typeof d.power !== 'number')) return 'non mesurée';
    return fmt(ps.filter(d => d.on).reduce((a, d) => a + d.power, 0), 0) + ' W';
  }
  return '';
}
/* Badge d'état d'un appareil : sans entité (jamais de mesure), hors ligne, sans nouvelles
   (valeur périmée), ou en ligne. */
function etatBadge(d){
  if (sansEntite(d)) return `<span class="badge" title="${SANS_ENTITE}">Sans entité</span>`;
  if (!d.online) return '<span class="badge bad"><span class="dot"></span>Hors ligne</span>';
  if (!fraiche(d)) return '<span class="badge warn"><span class="dot"></span>Sans nouvelles</span>';
  return '<span class="badge ok"><span class="dot"></span>En ligne</span>';
}
/* Sous-titre de la tuile « en ligne » : les appareils sans entité sont comptés à part, ils
   n'ont pas « perdu » leur remontée, ils n'en ont jamais eu. */
function horsLigneS(){
  const ne = S.devices.filter(sansEntite).length, off = S.devices.filter(d => !fraiche(d) && !sansEntite(d)).length;
  const t = [off ? off + ' sans remontée récente' : '', ne ? ne + ' sans entité' : ''].filter(Boolean).join(', ');
  return `<div class="s ${off ? 'bad' : ne ? 'warn' : 'ok'}">${t || 'Tous connectés'}</div>`;
}
/* En-tête : « En direct » seulement si le pont a répondu il y a moins de dix minutes. */
function etatPont(){
  const h = t => new Date(t).toLocaleTimeString('fr-FR');
  if (PONT_LOCAL){ const s = h(now()); return {direct:true, bas:'Valeurs simulées ' + s, haut:'Maquette locale, ' + s}; }
  if (PONT.actif && PONT.recu && now() - PONT.recu <= FRAICHEUR){
    const s = h(PONT.dernier || PONT.recu); return {direct:true, bas:'Dernière synchro ' + s, haut:'En direct, ' + s};
  }
  const der = PONT.recu ? h(PONT.dernier || PONT.recu) : null;
  const motif = PONT.jetonRequis ? 'Jeton du pont requis' : 'Pont injoignable';
  return {direct:false, bas:der ? 'Dernière synchro ' + der : 'Aucune synchro', haut:motif + (der ? ', dernière synchro ' + der : '')};
}
function refreshLive(){
  document.querySelectorAll('[data-live]').forEach(el => { const v = live(el.dataset.live); if (el.textContent !== v) el.textContent = v; });
  document.querySelectorAll('[data-etat]').forEach(el => { const d = S.devices.find(x => x.id === el.dataset.etat); const h = d ? etatBadge(d) : ''; if (el._h !== h){ el.innerHTML = el._h = h; } });
  document.querySelectorAll('[data-state]').forEach(el => { const b = S.batches.find(x => x.id === el.dataset.state); el.outerHTML = stateBadge(b, true); });
  document.querySelectorAll('[data-spark]').forEach(el => { const b = S.batches.find(x => x.id === el.dataset.spark); el.innerHTML = sparkPath(b); });
  document.querySelectorAll('[data-plugbtn]').forEach(el => { const d = S.devices.find(x => x.id === el.dataset.plugbtn); if (!d) return; el.setAttribute('aria-pressed', d.on ? 'true' : 'false'); el.textContent = d.on ? 'ON' : 'OFF'; el.closest('.outlet')?.classList.toggle('is-on', !!d.on); });
  const so = document.getElementById('strip-on'); if (so) so.textContent = outlets().filter(d => d.on).length;
  document.querySelectorAll('[data-plug]').forEach(el => { const d = S.devices.find(x => x.id === el.dataset.plug); if (d) el.setAttribute('aria-checked', d.on ? 'true' : 'false'); });
  document.querySelectorAll('[data-chart]').forEach(el => { if (!el._hover && el.dataset.live2 !== undefined) drawChart(el); });
  const jl = document.getElementById('journal-list');
  if (jl){ const b = S.batches.find(x => x.id === jl.dataset.b); const h = journalHTML(b); if (jl._h !== h){ jl.innerHTML = h; jl._h = h; } }
  const feed = document.getElementById('feed'); if (feed){ const h = feedHTML(activiteRecente()); if (feed._h !== h){ const st = feed.scrollTop; feed.innerHTML = feed._h = h; feed.scrollTop = st; } }
  /* L'en-tête ne dit plus « En direct » quand plus rien ne rentre : il nomme la panne et
     l'heure de la dernière synchro, et le témoin cesse d'être vert. */
  const ep = etatPont();
  document.getElementById('syncTxt').textContent = ep.bas;
  document.getElementById('syncTop').textContent = ep.haut;
  document.querySelector('.sync').title = ep.haut;
  document.querySelectorAll('.pulse').forEach(p => p.classList.toggle('eteint', !ep.direct));
}
function stateBadge(b, liveAttr){
  const [c, t] = status(b);
  return `<span class="badge ${c}" ${liveAttr && b.status === 'active' ? `data-state="${b.id}"` : ''}><span class="dot"></span>${t}</span>`;
}

/* ---------- Pont Home Assistant (même origine : /api/) ----------
   Le dashboard est servi par le cluster : nginx y expose /api/, qui parle à Home
   Assistant avec un jeton gardé dans le pod. Ouvert directement en local (file://)
   ou sans pont, rien ne répond : le dashboard garde alors exactement son
   comportement de maquette, valeurs simulées comprises. Aucune prise n'est
   commandée sans décision explicite : un clic de l'utilisateur, ou la régulation
   automatique par consigne (regulerPont) quand la prise est reliée à un lot actif et
   en mode « auto ». Rien d'autre ne touche aux relais. */
const PONT = { actif: false, disponible: null, dernier: null, recu: null, jeton: null, jetonRequis: false,
               regule: false, planSig: null, planT: 0, decT: 0 };
const PONT_CLE = 'hakko-pont-jeton';
/* PONT_LOCAL (page ouverte en file://) est déclarée en tête du script. */
/* La Meross MSS425F ne mesure pas la puissance : hors maquette, les watts simulés que
   d'anciennes versions ont persistés sont retirés, et rien ne les réécrit (voir tick). */
if (!PONT_LOCAL) S.devices.forEach(d => { if (d.kind === 'plug') delete d.power; });
const PONT_AIDE = 'Jeton du pont Home Assistant. Sur le serveur :\n'
  + 'kubectl -n scada-opus get secret pont-ha -o jsonpath="{.data.PONT_JETON}" | base64 -d';
function pontJeton(reinit){
  if (reinit){ try { localStorage.removeItem(PONT_CLE); } catch(e){} PONT.jeton = ''; }
  if (PONT.jeton == null){ try { PONT.jeton = localStorage.getItem(PONT_CLE) || ''; } catch(e){ PONT.jeton = ''; } }
  return PONT.jeton;
}
function pontDisponible(){ return PONT.disponible !== false; }
async function pontRequete(chemin, corps){
  const h = { 'Accept': 'application/json' };
  const j = pontJeton(); if (j) h['Authorization'] = 'Bearer ' + j;
  if (corps) h['Content-Type'] = 'application/json';
  return fetch('api/' + chemin, {
    method: corps ? 'POST' : 'GET', headers: h, cache: 'no-store',
    body: corps ? JSON.stringify(corps) : undefined,
  });
}
function pontApplique(reponse){
  let bascule = false;
  const recu = Date.now();
  /* Prises allumées que la page ne suit pas. Le `if (!d) return` juste en dessous ignore en
     silence ce que la page ne connaît pas : une résistance peut donc chauffer sans que rien ne
     l'affiche. C'est exactement ce qui est arrivé à une prise reliée à aucun lot, allumée côté
     Home Assistant et absente du tableau de bord. On les retient, on les montre sur la page
     Appareils, et on l'écrit au journal une fois par épisode — pas à chaque synchronisation. */
  const inconnues = (reponse.appareils || [])
    .filter(a => a.etat === 'on' && !S.devices.some(x => x.eid === a.entite))
    .map(a => a.entite);
  if (inconnues.join('|') !== (S.prisesInconnues || []).join('|')){
    const nouvelles = inconnues.filter(e => !(S.prisesInconnues || []).includes(e));
    const rentrees = (S.prisesInconnues || []).filter(e => !inconnues.includes(e));
    if (nouvelles.length) logEvent('alert', (nouvelles.length > 1
      ? 'Des prises allumées ne sont reliées à aucun lot : ' : "Une prise allumée n'est reliée à aucun lot : ")
      + nouvelles.join(', ') + '. Elle chauffe peut-être sans que rien ne soit mesuré — reliez-la à un lot, ou coupez-la.');
    if (rentrees.length) logEvent('note', (rentrees.length > 1 ? 'Prises allumées hors lot depuis éteintes : ' : 'Prise allumée hors lot depuis éteinte : ') + rentrees.join(', ') + '.');
    S.prisesInconnues = inconnues;
  }
  (reponse.appareils || []).forEach(a => {
    const d = S.devices.find(x => x.eid === a.entite); if (!d) return;
    const enLigne = a.disponible !== false, etaitFraiche = fraiche(d);
    if (d.online !== enLigne){ d.online = enLigne; bascule = true; }
    /* Fraîcheur et « Dernière remontée » : c'est ici, et seulement ici, qu'une valeur réelle
       est reçue. d.recu date la valeur affichée ; d.seen alimente la colonne « Dernière
       remontée ». Une sonde disponible mais sans valeur numérique ne rafraîchit ni l'un ni
       l'autre : son ancienne valeur ne doit pas passer pour fraîche. */
    if (d.kind === 'plug'){ if (enLigne){ d.recu = recu; d.seen = recu; } }
    else if (enLigne && a.valeur != null && !isNaN(a.valeur)){ d.recu = recu; d.seen = recu; }
    if (d.kind === 'plug'){
      const etat = (a.etat === 'on'), tc = Date.now();
      /* Un état qui change sans commande de la page vient d'ailleurs : Home Assistant,
         une automatisation, le bouton de la multiprise. Personne ne le surveille, et la
         page doit le dire au lieu d'afficher un état sans origine. */
      if (d.on !== etat && !(d.cmdT && tc - d.cmdT < 90000)){ d.origine = 'externe'; d.origineT = tc; }
      d.on = etat;
    }
    else if (a.valeur != null) d.value = a.valeur;
    if (a.batterie != null) d.battery = Math.round(a.batterie);
    /* Une valeur qui redevient fraîche (ou cesse de l'être) change ce que la page affiche
       hors des cellules « live » : on redessine comme pour un passage en ligne. */
    if (fraiche(d) !== etaitFraiche) bascule = true;
  });
  PONT.actif = true; PONT.disponible = true; PONT.recu = recu;
  PONT.dernier = new Date((reponse.horodatage || 0) * 1000 || Date.now());
  return bascule;
}
/* ---------------------------------------------------------------------------
   Le plan de régulation remis au pont.

   C'est le pont qui décide désormais : une fermentation dure des jours et personne
   ne garde un onglet ouvert trois semaines. La page reste le poste de réglage —
   elle dépose consigne, sonde, prises et fin prévue, puis elle affiche ce que le
   pont a décidé. Tant que le pont régule, la page ne commande plus d'elle-même :
   deux régulateurs se contrediraient.
   --------------------------------------------------------------------------- */
function planRegulation(){
  return S.batches.filter(b => b.status === 'active').map(b => {
    const r = b.recipe || {};
    const appareils = devsOf(b).filter(d => d.eid && !d.demo);
    const prises = appareils.filter(d => d.kind === 'plug').map(d => d.eid);
    /* Seulement une sonde de TEMPÉRATURE : une sonde d'humidité ne dit pas la
       température, et faire chauffer sur elle serait chauffer à l'aveugle. */
    const sonde = (appareils.find(d => d.kind === 'temp') || {}).eid;
    const consigne = Number(r.temp);
    if (!prises.length || !sonde || !Number.isFinite(consigne)) return null;
    const debut = b.start || now();
    /* La fin de lot part en SECONDES, comme time.time() côté pont, et « durée » est en
       jours (c'est ce que dit le formulaire de recette). Envoyer des millisecondes
       rendait la comparaison toujours fausse : la chauffe ne s'arrêtait jamais à
       l'échéance prévue. */
    const dureeJours = Number(r.duration);
    const fin = (Number.isFinite(dureeJours) && dureeJours > 0)
      ? Math.round(debut / 1000 + dureeJours * 86400) : null;
    return { id: b.id, nom: b.name || b.id, actif: true, sonde: sonde, prises: prises,
             consigne: consigne, ecart: Number.isFinite(Number(r.tol)) ? Math.abs(Number(r.tol)) : 0.2,
             fin: fin };
  }).filter(Boolean);
}
async function pontLireRegul(){
  /* Ce que le pont dit de lui-même : est-ce qu'il régule, et qu'a-t-il décidé.
     C'est cette réponse — et non un souvenir de la page — qui autorise la page à
     s'effacer. Un pont redémarré a perdu son plan : la page doit le voir et le lui
     redéposer tout de suite, pas dans dix minutes. */
  if (PONT_LOCAL || !PONT.actif) { PONT.regule = false; return null; }
  let r = null, j = null;
  try { r = await pontRequete('regul'); } catch(e){ PONT.regule = false; return null; }
  if (!r.ok) { PONT.regule = false; return null; }
  try { j = await r.json(); } catch(e){ PONT.regule = false; return null; }
  PONT.regule = !!(j && j.regule === true && (j.lots || []).some(l => l.actif));
  const neuves = (((j || {}).decisions) || []).filter(x => (x.t || 0) > PONT.decT);
  if (neuves.length){
    /* Ce que le pont a réellement commandé, avec ses mots : la page ne doit pas
       raconter autre chose que ce qui s'est passé sur la prise. */
    neuves.slice(-12).forEach(x => {
      const k = x.allume === true ? 'heat-on' : (x.allume === false ? 'heat-off' : 'note');
      logEvent(k, (x.nom ? x.nom + ' — ' : '') + (x.x || 'décision du pont'), x.lot, { reel: true, pont: true });
    });
    PONT.decT = Math.max(...neuves.map(x => x.t || 0), PONT.decT);
  }
  return j;
}
async function pontPoussePlan(){
  if (PONT_LOCAL || !PONT.actif || PONT.jetonRequis) return false;
  const lots = planRegulation();
  const sig = JSON.stringify(lots);
  /* On ne redépose pas à chaque synchronisation, seulement quand le plan change, quand
     le pont a perdu le sien, ou toutes les dix minutes — un pod redémarré l'oublie. */
  if (PONT.regule && sig === PONT.planSig && now() - PONT.planT < 10 * 60e3) return true;
  let r = null;
  try { r = await pontRequete('regul', { lots: lots, sans_mesure_max: Math.round(SANS_MESURE_MAX / 1000) }); }
  catch(e){ return false; }
  if (!r.ok) return false;                       /* refusé : la page garde la main */
  let j = null; try { j = await r.json(); } catch(e){ return false; }
  if (!j || j.ok === false) return false;
  PONT.regule = j.regule === true;
  PONT.planSig = sig; PONT.planT = now();
  return true;
}
async function pontSynchro(silencieux){
  if (PONT_LOCAL) return false;
  // Sans jeton enregistré, inutile de réessayer toutes les quinze secondes : on attend
  // le clic de l'utilisateur, qui déclenchera la demande de jeton. Cela évite aussi de
  // remplir la console de 401 alors que rien n'est cassé.
  if (silencieux && PONT.jetonRequis) return false;
  let r;
  try { r = await pontRequete('etat'); }
  catch(e){ PONT.actif = false; PONT.disponible = false; refreshLive(); return false; }
  if (r.status === 401 || r.status === 403){
    PONT.actif = false; PONT.disponible = true;
    if (silencieux){ PONT.jetonRequis = true; return false; }
    const saisi = prompt(PONT_AIDE);
    if (!saisi || !saisi.trim()) return false;
    pontJeton(true); PONT.jeton = saisi.trim(); PONT.jetonRequis = false;
    try { localStorage.setItem(PONT_CLE, PONT.jeton); } catch(e){}
    return pontSynchro(true);
  }
  if (!r.ok){ PONT.actif = false; PONT.disponible = true; refreshLive(); return false; }
  let d = null; try { d = await r.json(); } catch(e){ return false; }
  if (!d || d.ok === false){ PONT.actif = false; return false; }
  const bascule = pontApplique(d);
  /* Le pont est joignable : on lit d'abord ce qu'il dit de lui-même (régule-t-il ?),
     puis on lui confie le plan s'il ne l'a plus. Ces appels décident PONT.regule,
     qui coupe la régulation locale. */
  pontLireRegul().then(() => pontPoussePlan());
  /* Garde-fou « sonde muette » de la page : il se tait quand le pont régule, car le
     pont a le sien et deux coupeurs simultanés ne servent à rien. */
  couperSansMesure().catch(() => {});
  enregistrerTemperatures();
  save();
  if (bascule || !silencieux) render(); else refreshLive();
  return true;
}
/* Arrêt explicite d'une prise réelle, utilisé à la clôture d'un lot.
   On n'utilise PAS pontBascule : elle inverse l'état affiché, qui peut dater (page restée
   ouverte, prise changée ailleurs) et enverrait alors l'ordre opposé — un allumage. Ici
   l'argument est littéralement `allume: false`, et uniquement sur une prise rattachée au lot
   qu'on termine. */
/* Garde-fou décidé par le propriétaire du matériel : une résistance ne doit pas chauffer à
   l'aveugle. Si une prise allumée dépend d'un lot dont la sonde ne remonte plus rien depuis
   SANS_MESURE_MAX, on la coupe — au lieu d'attendre AUTO_MAX_ON (45 min) ou le chien de
   garde du pont (90 min). Quinze minutes, c'est volontairement long : un hoquet de radio dure
   quelques secondes, une sonde morte reste morte. Fonction séparée, appelée par la
   synchronisation : les freins de régulation (regulerPont et compagnie) ne sont pas touchés. */
const SANS_MESURE_MAX = 15 * 60e3;
async function couperSansMesure(){
  if (PONT_LOCAL || !PONT.actif || PONT.regule) return 0;
  let n = 0;
  for (const b of S.batches.filter(x => x.status === 'active')){
    const appareils = devsOf(b);
    /* Le cas visé est la sonde qui se tait, pas le lot qui n'en a jamais eu : sans sonde du
       tout, ce sont les délais existants qui s'appliquent. */
    const sondes = appareils.filter(d => d.kind === 'temp' || d.kind === 'hum');
    if (!sondes.length) continue;
    const prises = appareils.filter(d => d.kind === 'plug' && d.on && d.eid && !d.demo);
    if (!prises.length) continue;
    if (currentTemp(b) != null) continue;                     /* mesure fraîche : la régulation travaille */
    const derniere = Math.max(...sondes.map(d => d.recu || 0));
    const silence = now() - derniere;
    if (silence < SANS_MESURE_MAX) continue;
    const minutes = Math.round(silence / 60000);
    logEvent('alert', 'Chauffe coupée : plus aucune mesure depuis ' + minutes
      + ' min — ' + prises.map(d => d.name).join(', ') + ' arrêtée'
      + (prises.length > 1 ? 's' : '') + '. Vérifiez la sonde, puis relancez la chauffe.', b.id, { reel: true });
    for (const d of prises){ await couperPrise(d, b.id, 'coupée : la sonde ne remonte plus depuis ' + minutes + ' min'); n++; }
  }
  return n;
}
async function couperPrise(d, bid, motif){
  if (PONT_LOCAL || !d.eid) return false;
  /* Tout échec doit se voir. L'appareil vient d'être libéré du lot et la page ne doit pas
     l'afficher « éteint » alors que rien ne prouve que le relais s'est ouvert : on le remet
     à « allumé » — l'hypothèse prudente — avec une alerte et une ligne au journal. `bid` est
     passé en argument : au moment où cette fonction asynchrone journalise, d.batch n'existe
     plus, et l'événement se retrouverait sans lot. */
  const echec = (motif) => {
    d.on = true;
    logEvent('alert', d.name + ' : coupure refus\u00e9e \u00e0 la cl\u00f4ture du lot \u2014 ' + motif
      + ' ; la prise est peut-\u00eatre encore allum\u00e9e', bid, { reel: true });
    save(); render();
    alert('La prise « ' + d.name + ' » n\u2019a pas pu \u00eatre coup\u00e9e \u00e0 la cl\u00f4ture du lot.\n'
      + motif + '\nElle est peut-\u00eatre encore allum\u00e9e : v\u00e9rifiez-la dans Home Assistant.');
    return false;
  };
  if (PONT.jetonRequis && !await pontSynchro(false)) return echec('jeton absent ou refus\u00e9');
  let r;
  try { r = await pontRequete('prise', { entite: d.eid, allume: false }); }
  catch(e){ return echec('pont Home Assistant injoignable'); }
  if (r.status === 401 || r.status === 403){
    if (!await pontSynchro(false)) return echec('jeton expir\u00e9 ou refus\u00e9 (HTTP ' + r.status + ')');
    try { r = await pontRequete('prise', { entite: d.eid, allume: false }); }
    catch(e){ return echec('pont Home Assistant injoignable'); }
  }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j || j.ok === false) return echec('le pont a r\u00e9pondu HTTP ' + r.status);
  d.on = false;
  /* Le motif est dit exactement : une coupure de garde-fou n'est pas une clôture de lot. */
  logEvent('heat-off', d.name + ' : ' + (motif || 'coupée à la clôture du lot'), bid, { reel: true });
  return true;
}
async function pontBascule(d){
  // Sans jeton enregistré, on le demande tout de suite : envoyer la commande d'abord
  // ne produirait qu'un 401 inutile.
  if (PONT.jetonRequis){
    if (!await pontSynchro(false)) return false;
  } else {
    // On repart de l'état réel juste avant de commander : l'état affiché peut dater
    // (page restée ouverte, prise changée ailleurs), et inverser une valeur périmée
    // enverrait la commande opposée à celle voulue.
    await pontSynchro(true);
  }
  const voulu = !d.on;
  let r;
  try { r = await pontRequete('prise', { entite: d.eid, allume: voulu }); }
  catch(e){
    alert('Pont Home Assistant injoignable : « ' + d.name + ' » n\'a pas été commandée.');
    return true;
  }
  if (r.status === 401 || r.status === 403){
    if (!await pontSynchro(false)) return false;
    try { r = await pontRequete('prise', { entite: d.eid, allume: voulu }); }
    catch(e){ return false; }
  }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j || j.ok === false){
    // Une commande refusée doit se voir tout de suite : l'utilisateur vient de
    // cliquer sur une prise, il ne doit pas croire qu'elle a changé d'état.
    logEvent('alert', d.name + ' : commande refusée par le pont (HTTP ' + r.status + ')', d.batch || null);
    alert('Commande refusée par le pont Home Assistant (HTTP ' + r.status + ').\n'
      + "La prise « " + d.name + " » n'a pas changé d'état.");
    save(); render(); return true;
  }
  d.on = (j.etat === 'on'); d.mode = 'manuel'; d.origine = 'clic'; d.origineT = now(); d.cmdT = now();
  logEvent(d.on ? 'heat-on' : 'heat-off',
    d.name + ' : ' + (d.on ? 'activation' : 'désactivation') + ' de la prise depuis le dashboard',
    d.batch || null);
  PONT.dernier = new Date();
  save(); render(); pontSynchro(true);
  if (j.confirme === false){
    // La multiprise n'avait pas encore confirmé : on revérifie à quelques reprises
    // plutôt que de laisser à l'écran un état que Home Assistant n'a pas confirmé.
    [1500, 3500, 6000].forEach(ms => setTimeout(() => pontSynchro(true), ms));
  }
  return true;
}
/* ---------- Régulation automatique (consigne) ---------- */
/* La page décide, le pont exécute. Trois freins, parce qu'il s'agit d'un relais réel :
   une seule commande à la fois, au plus une par minute sur la même prise (un relais qui
   claque use ses contacts sans jamais atteindre sa consigne), et une coupure de sécurité
   après AUTO_MAX_ON minutes de chauffe continue — une sonde qui décroche ne doit pas
   transformer l'étuve en four. Une commande refusée ou un pont injoignable ne se réessaie
   pas en boucle : c'est écrit dans le journal du dashboard et visible à l'écran. */
let regulEnCours = false;
async function regulerPont(d, b, tp, voulu, securite){
  const t = now();
  if (regulEnCours) return;
  if (securite !== true){
    if (d.regulPause && t < d.regulPause) return;
    if (d.regulRefus && t - d.regulRefus < AUTO_REFUS) return;
    if (d.regulT && t - d.regulT < AUTO_COOLDOWN) return;
  }
  regulEnCours = true; d.regulT = t;
  try {
    // « auto » : le pont arme sa surveillance et coupera lui-même si la page disparaît.
    const r = await pontRequete('prise', { entite: d.eid, allume: voulu, auto: true });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || j.ok === false) throw new Error('HTTP ' + r.status);
    d.on = (j.etat === 'on'); d.regulDepuis = d.on ? t : null; d.origine = 'regul'; d.origineT = t; d.cmdT = t;
    logHeat(d, b, tp, false, null, false, true);   /* commande réellement envoyée au relais */
    if (securite === true) logEvent('alert', d.name + ' : chauffe automatique interrompue après '
      + Math.round(AUTO_MAX_ON / 60000) + ' min sans atteindre la consigne', b ? b.id : null);
    save(); render();
    if (j.confirme === false) [1500, 3500].forEach(ms => setTimeout(() => pontSynchro(true), ms));
  } catch(e){
    d.regulRefus = t;
    logEvent('alert', d.name + ' : régulation automatique sans effet (' + e.message + ')', b ? b.id : null);
    save(); render();
  } finally { regulEnCours = false; }
}
function regulerSecurite(d, b){
  // Le relais retombe tout de suite (on ne poireaute pas une minute de plus), puis la
  // régulation se tait un moment au lieu de relancer aussitôt un cycle identique.
  d.regulPause = now() + AUTO_PAUSE; d.regulDepuis = null;
  regulerPont(d, b, currentTemp(b), false, true);
}

function chartCfg(b){

const dtLocal = t => { const d = new Date(t - new Date(t).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
function gravHTML(b, active){
  const r = b.recipe, list = (b.gravity || []).slice().sort((a, c) => c[0] - a[0]);
  return `<div class="grav-side">
    ${active ? `<form class="grav-form" data-form="gravity" data-id="${b.id}">
      <label class="field"><span>Densité mesurée</span><input type="number" name="g" step="0.001" min="0.990" max="1.150" placeholder="1.007" required></label>
      <label class="field"><span>Date de la mesure</span><input type="datetime-local" name="d" value="${dtLocal(now())}" max="${dtLocal(now())}" required></label>
      <button class="btn">Ajouter le relevé</button></form>` : ''}
    <div class="scroll grav-list"><table class="data"><thead><tr><th>Date</th><th class="r">Densité</th><th class="r">Alcool</th><th></th></tr></thead><tbody>
    ${list.map(([t, g]) => `<tr><td class="num sm">${fmtDate(t)}, ${fmtTime(t)}</td><td class="r num nm">${fmt(g, 3)}</td><td class="r num">${fmt((r.og - g) * 131.25, 1)} %</td><td class="r">${active ? `<button type="button" class="icon-btn bare" data-action="rm-grav" data-id="${b.id}" data-t="${t}" aria-label="Supprimer ce relevé">${IC.x}</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
let journalFilter = 'all';
function journalHTML(b, jf){
  jf = jf || journalFilter;
  let items = b.notes.map(n => ({t:n.t, k:'note', x:n.x}));
  /* Un événement simulé ne se lit que là où la simulation est le sujet : un lot de
     démonstration, ou la page ouverte sans pont. Le journal d'un lot réel ne garde que
     les commandes réellement parties. */
  S.events.filter(e => e.b === b.id && evVisible(e) &&(((e.k === 'heat-on' || e.k === 'heat-off') && e.tp != null) || e.k === 'target')).forEach(e => items.push(e));
  if (jf === 'note') items = items.filter(i => i.k === 'note');
  if (jf === 'heat') items = items.filter(i => i.k === 'heat-on' || i.k === 'heat-off');
  if (jf === 'target') items = items.filter(i => i.k === 'target');
  items.sort((a, c) => c.t - a.t);
  if (!items.length) return '<li class="muted">Aucune entrée.</li>';
  return items.slice(0, 150).map(i => {
    let body, tag;
    if (i.k === 'note'){ tag = '<span class="badge">Note</span>'; body = esc(i.x); }
    else if (i.k === 'target'){ tag = '<span class="badge acc">Consigne</span>'; body = `Consigne modifiée de ${fmt(i.from, 1)} °C à <strong>${fmt(i.to, 1)} °C</strong>`; }
    else {
      const dl = i.tp - i.tg, on = i.k === 'heat-on';
      tag = `<span class="badge ${on ? 'warn' : ''}">${on ? 'Chauffe on' : 'Chauffe off'}</span>`;
      body = `<strong>${fmt(i.tp, 1)} °C</strong> (${dl >= 0 ? '+' : '−'}${fmt(Math.abs(dl), 1)} °C) - ${on ? 'Activation' : 'Désactivation'} de la chauffe${i.manual ? ', manuelle' : ''}${i.restaure ? ' <span class="muted">(restauré, provenance non vérifiée)</span>' : ''}`;
    }
    return `<li class="jl"><time class="num">${fmtDate(i.t)}, ${fmtTime(i.t)}</time>${tag}<span class="num jt">${body}</span></li>`;
  }).join('');
}

  const runs = id => S.batches.filter(b => b.recipeId === id);
  const rows = list.map(r => {
    const T = TYPES[r.type], rs = runs(r.id), last = rs.length ? Math.max(...rs.map(b => b.start)) : null;

function regulParCetOnglet(){
  let vu = null; try { vu = JSON.parse(localStorage.getItem(REGUL_CLE) || 'null'); } catch(e){}

/* « Qui surveille cette prise » : chaque condition que tick() exige pour réguler est
   vérifiée ici, dans le même ordre. La page ne dit « régulée » que si elle régule vraiment.
   warn : la prise peut chauffer sans que personne ne la coupe, ou la régulation est arrêtée. */
function surveillance(d){
  const hm = t => fmtTime(t);
  if (!d.online) return {t:'hors ligne', warn:true};
  if (!fraiche(d)) return {t:'état inconnu : aucune remontée récente du pont', warn:true};
  const b = S.batches.find(x => x.id === d.batch && x.status === 'active');
  /* En maquette, tick() bascule localement toute prise en auto reliée à un lot, démo comprise. */
  if (PONT_LOCAL && d.mode === 'auto' && b) return {t:'régulée par la simulation (maquette locale)', warn:false};
  if (d.demo) return {t:'lien de démonstration, non régulée', warn:!!d.on};
  if (d.mode === 'auto'){
    if (!b) return {t:'en auto, mais reliée à aucun lot en cours : non régulée', warn:!!d.on};
    if (!d.eid) return {t:'sans entité Home Assistant : non régulée', warn:!!d.on};
    if (!PONT.actif) return {t:'non régulée : pont injoignable', warn:true};
    if (!regulParCetOnglet()) return {t:'régulée par un autre onglet de ce navigateur', warn:false};
    const t = now();
    if (d.regulPause && t < d.regulPause) return {t:'non régulée : pause de sécurité jusqu’à ' + hm(d.regulPause), warn:true};
    if (d.regulRefus && t - d.regulRefus < AUTO_REFUS) return {t:'non régulée : commande refusée, nouvel essai après ' + hm(d.regulRefus + AUTO_REFUS), warn:true};
    if (currentTemp(b) == null) return {t:sansMesure(b) === 'Sonde sans entité' ? 'non régulée : la sonde du lot n’a pas d’entité Home Assistant' : 'non régulée : aucune mesure de température récente', warn:true};
    /* La coupure à 90 min n'est armée que par une commande automatique (auto: true). */
    if (d.on && d.origine !== 'regul') return {t:'régulée par la page, mais allumée ' + (d.origine === 'externe' ? 'hors du dashboard' : 'sans commande automatique') + ' : le serveur ne la coupera pas', warn:true};
    if (d.on) return {t:'régulée par la page, coupée par le serveur au plus tard 90 min après la dernière commande automatique', warn:false};
    return {t:'régulée par la page', warn:false};
  }
  if (d.origine === 'externe') return {t:'changée hors du dashboard, personne ne la surveille', warn:true};
  if (d.on) return {t:'allumée à la main, personne ne la surveille', warn:true};
  return {t:'à l’arrêt', warn:false};
}

function restaurerEvenements(indices){

  S.events = S.events.concat(pris).sort((a, c) => c.t - a.t);
  logEvent('note', pris.length + (pris.length > 1 ? ' événements mis de côté restaurés' : ' événement mis de côté restauré') + ' (provenance non vérifiée)');
  const r = restaurationsOuvertes = restaurationsOuvertes || {evs:[], notes:[]};
  r.evs.push(...pris); r.notes.push(S.events[0]);

}
/* Défait les restaurations faites depuis l'ouverture de la boîte : état d'avant, à l'identique. */
function annulerRestauration(){
  const r = restaurationsOuvertes; restaurationsOuvertes = null;
  if (!r) return 0;
  S.events = S.events.filter(e => !r.evs.includes(e) && !r.notes.includes(e));
  r.evs.forEach(e => { delete e.restaure; });

let archType = 'all', archQuery = '';
const statsCache = new Map();
function setAt(b, t){
  const L = b.targets; if (!L || !L.length) return b.recipe.temp;
  let v = L[0][1]; for (const [tc, nv] of L) if (tc <= t) v = nv; return v;
}
function archStats(b){
  const key = b.id + ':' + b.end + ':' + (b.targets ? b.targets.length : 0);
  if (statsCache.has(key)) return statsCache.get(key);
  const r = b.recipe, tol = TYPES[r.type].tol / 2, end = b.end, span = end - b.start;
  const n = 160, pts = [], hum = [], pmin = [], pmax = [];
  let sum = 0, sq = 0, min = Infinity, max = -Infinity, inR = 0, hs = 0, hc = 0;
  const K = 40, raw = [];
  for (let i = 0; i <= n; i++){
    const t = b.start + span * i / n; let at = 0, ah = 0, hk = 0, lo = Infinity, hi = -Infinity;
    for (let k = 0; k < K; k++){
      const tt = Math.min(end, t + (k - K / 2) * span / n / K), m = model(b, tt);
      raw.push([tt, m.temp]); at += m.temp; lo = Math.min(lo, m.temp); hi = Math.max(hi, m.temp); sum += m.temp; sq += m.temp * m.temp;
      min = Math.min(min, m.temp); max = Math.max(max, m.temp);
      if (Math.abs(m.temp - setAt(b, tt)) <= tol) inR++;
      if (m.hum != null){ ah += m.hum; hk++; hs += m.hum; hc++; }
    }
    pts.push([t, at / K]); pmin.push([t, lo]); pmax.push([t, hi]); if (hk) hum.push([t, ah / hk]);
  }
  const N = (n + 1) * K, avg = sum / N, sd = Math.sqrt(Math.max(0, sq / N - avg * avg));
  inR = inR / N * (n + 1);
  // Chauffe : simulation de l'hystérésis sur toute la durée
  let heat = null;
  if ((b.devSnap || []).some(d => d.kind === 'plug')){
    let on = false, acts = 0, onMs = 0; const st = Math.max(5 * 60e3, span / 20000);
    for (let t = b.start; t < end; t += st){
      const tp = model(b, t).temp, tg = setAt(b, t);
      if (!on && tp < tg - HYST){ on = true; acts++; } else if (on && tp > tg + HYST) on = false;
      if (on) onMs += st;
    }
    heat = {acts, hours: onMs / HOUR, duty: onMs / span * 100};
  }
  // Agrégats journaliers (ou par 4 h si lot court)
  const bucket = span < 3 * DAY ? 4 * HOUR : span > 90 * DAY ? 7 * DAY : DAY;
  const daily = [];
  for (let t0 = b.start; t0 < end; t0 += bucket){
    const seg = raw.filter(p => p[0] >= t0 && p[0] < t0 + bucket); if (seg.length < 40) continue;
    const v = seg.map(p => p[1]);
    daily.push({t:t0 + bucket / 2, avg:v.reduce((a, c) => a + c, 0) / v.length, min:Math.min(...v), max:Math.max(...v)});
  }
  const s = {pts, pmin, pmax, hum, avg, sd, min, max, inRange: inR / (n + 1) * 100, humAvg: hc ? hs / hc : null, heat, daily, bucket, span};
  statsCache.set(key, s); return s;
}

  if (r.type === 'koji'){ const s = archStats(b); return s.humAvg != null ? `${fmt(s.humAvg, 0)} % HR moy.` : '—'; }

      <section class="card dp-journal scroll-card arch-2"><div class="card-h"><h2>${second[0]}</h2></div>
