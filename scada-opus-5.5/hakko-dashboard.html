<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakko — Supervision des fermentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#F7F8FA; --hover:#F1F3F6;
  --ink:#111827; --ink2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line2:#D1D5DB; --grid:#EEF0F3;
  --accent:#2350B8; --accent-soft:#EAF0FC;
  --ok:#15803D; --ok-bg:#E7F6EC; --warn:#B45309; --warn-bg:#FDF3E1; --bad:#B91C1C; --bad-bg:#FDECEC;
  --biere:#C98410; --miso:#95602F; --koji:#5A8A2E; --garum:#9B2C4A;
  --side:#151A21; --side-ink:#AEB6C2; --side-ink2:#F3F5F8; --side-active:#232A34; --side-line:#262D38;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A21; --surface2:#1A1F27; --hover:#1E242D;
    --ink:#E6EAF0; --ink2:#C4CAD3; --muted:#8C95A3; --faint:#6B7380;
    --line:#262C36; --line2:#323A46; --grid:#1F252E;
    --accent:#7FA2EC; --accent-soft:#1C2740;
    --ok:#5CC486; --ok-bg:#142A1D; --warn:#E8A955; --warn-bg:#2E2412; --bad:#F07F7F; --bad-bg:#321818;
    --biere:#E3A53A; --miso:#C98E5A; --koji:#8DBE5C; --garum:#D66E8A;
    --side:#0A0C10; --side-active:#1B2029; --side-line:#1C212A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface2:#1A1F27; --hover:#1E242D;
  --ink:#E6EAF0; --ink2:#C4CAD3; --muted:#8C95A3; --faint:#6B7380;
  --line:#262C36; --line2:#323A46; --grid:#1F252E;
  --accent:#7FA2EC; --accent-soft:#1C2740;
  --ok:#5CC486; --ok-bg:#142A1D; --warn:#E8A955; --warn-bg:#2E2412; --bad:#F07F7F; --bad-bg:#321818;
  --biere:#E3A53A; --miso:#C98E5A; --koji:#8DBE5C; --garum:#D66E8A;
  --side:#0A0C10; --side-active:#1B2029; --side-line:#1C212A;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
svg.i{width:16px;height:16px;flex:none}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;height:60px;padding:0 20px;color:var(--side-ink2);font-weight:600;font-size:15px;border-bottom:1px solid var(--side-line)}
.brand-mark{width:28px;height:28px;border-radius:7px;background:#F3F5F8;color:#151A21;display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);margin-top:-2px}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:12px;color:#6F7885;padding:14px 10px 6px}
.nav-sec:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-weight:500}
.nav a:hover{color:var(--side-ink2);background:rgba(255,255,255,.04)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-ink2)}
.nav a[aria-current="page"] svg{color:#8FB0F5}
.nav a .cnt{margin-left:auto;font-size:12px;color:#6F7885}
.side-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--side-line);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.side-foot strong{color:var(--side-ink2);font-weight:500;display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:#34C06A;box-shadow:0 0 0 3px rgba(52,192,106,.18)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;height:60px;display:flex;align-items:center;gap:16px;padding:0 32px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--line2)}
.crumbs .cur{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
.sync{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.bare{border-color:transparent;background:none}
.content{padding:28px 32px 64px;width:100%}
.tabbar{display:none}
.m-brand{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:0 16px}
  .m-brand{display:grid}
  .sync-txt{display:none}
  .content{padding:20px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:500}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a[aria-current="page"]{color:var(--accent)}
}

/* ---------- Page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-size:22px;line-height:1.3}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1116}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:52px}
.card-h h2{font-size:14px}
.card-h .sub{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.card-b{padding:18px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.type{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.type i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs button{border:0;background:none;height:44px;padding:0 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{margin-left:6px;font-size:12px;padding:1px 6px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 11px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar>div{height:100%;border-radius:3px;background:var(--c,var(--accent))}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi .s.ok{color:var(--ok)} .kpi .s.bad{color:var(--bad)} .kpi .s.warn{color:var(--warn)}

/* ---------- Overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:12px}
.lot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.lot:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(16,24,40,.06)}
.lot-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.lot-n{padding:6px 14px 0;font-weight:600;font-size:15px}
.lot-m{padding:2px 14px 0;color:var(--muted);font-size:12.5px}
.lot-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 14px 0;border:1px solid var(--line);border-radius:7px}
.lot-metrics>div{padding:8px 10px;border-left:1px solid var(--line)}
.lot-metrics>div:first-child{border-left:0}
.lot-metrics .k{font-size:11.5px;color:var(--muted)}
.lot-metrics .v{font-size:16px;font-weight:600}
.lot-metrics .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.spark{display:block;width:calc(100% - 28px);height:44px;margin:10px 14px 0}
.lot-f{padding:10px 14px 14px;margin-top:auto}
.lot-f .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 18px}
.feed .fi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.feed .fi svg{width:14px;height:14px}
.feed .fi.heat{color:var(--warn)} .feed .fi.note{color:var(--accent)} .feed .fi.batch{color:var(--ok)}
.feed .ft{font-size:13px;color:var(--ink2);line-height:1.4}
.feed .fm{font-size:12px;color:var(--faint)}
.side-stack{display:flex;flex-direction:column;gap:20px}
.health{list-style:none;margin:0;padding:6px 0}
.health li{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13px}
.health li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.health li .vl{color:var(--muted)}
@media (max-width:1180px){.ov{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--hover)}
table.data .r{text-align:right}
table.data .nm{font-weight:500;color:var(--ink)}
table.data .sm{font-size:12.5px;color:var(--muted)}
table.data select{height:30px;padding:0 8px;font-size:13px;max-width:210px}
.bat{display:flex;align-items:center;gap:8px}
.bat .bar{width:48px}
.dev-cell{display:flex;align-items:center;gap:10px}
.dev-ic{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.dev-ic svg{width:15px;height:15px}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:900px){
  table.data.stack thead{display:none}
  table.data.stack,table.data.stack tbody,table.data.stack tr{display:block}
  table.data.stack tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.data.stack tr:last-child{border-bottom:0}
  table.data.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:right}
  table.data.stack td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
  table.data.stack td.first{justify-content:flex-start;text-align:left;padding-bottom:8px}
  table.data.stack .ctl{justify-content:flex-end}
}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:0 1 280px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search input{padding-left:32px}
.toolbar .spacer{flex:1}

/* ---------- Inputs ---------- */
input[type=text],input[type=number],input[type=search],select,textarea{height:36px;background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:0 11px;width:100%;outline:none;box-shadow:var(--shadow)}
textarea{height:auto;min-height:88px;padding:9px 11px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:500;color:var(--ink2)}
.field>span em{font-style:normal;font-weight:400;color:var(--faint);margin-left:4px}
.field .unit{position:relative}
.field .unit input{padding-right:44px}
.field .unit b{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-weight:400;color:var(--faint);font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}

/* ---------- Detail ---------- */
.dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.dh h1{font-size:24px;line-height:1.25;margin-top:8px}
.dh .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh .sub{color:var(--muted);margin-top:4px}
.dh .sub a{color:var(--accent)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;margin-bottom:20px}
.dcol{display:flex;flex-direction:column;gap:20px}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .tip{position:absolute;top:-4px;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;transform:translateX(-50%)}
.chart svg text{font-family:inherit}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;background:var(--c)}
.legend i.dash{background:none;border-top:2px dashed var(--c);opacity:.7}
.legend i.band{height:10px;background:var(--c);opacity:.12}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;font-size:13.5px}
.kv dt{color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line)}
.kv dd{margin:0;text-align:right;padding:9px 0;border-bottom:1px solid var(--line);font-weight:500}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px}
.strip span{aspect-ratio:1;border-radius:2px;background:var(--grid)}
.strip span.past{background:var(--c)}
.strip span.now{background:var(--c);opacity:.45;outline:1.5px solid var(--c);outline-offset:1px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.prog-top strong{font-size:20px;font-weight:600}
.dates{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px}
.dates .k{color:var(--muted)} .dates .v{font-weight:500;font-size:13.5px}
.dates div:last-child{text-align:right}
.dates div:nth-child(2){text-align:center}
.d3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.notes{list-style:none;margin:0;padding:0}
.notes li{padding:12px 18px;border-bottom:1px solid var(--line)}
.notes li:last-child{border-bottom:0}
.notes time{display:block;font-size:12px;color:var(--faint);margin-bottom:2px}
.note-form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 10px 10px}
.note-form input{flex:1;min-width:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;color:var(--muted);font-weight:500}
@media (max-width:1180px){.dgrid{grid-template-columns:1fr}.d3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.d3{grid-template-columns:1fr}}

/* ---------- Recipe form ---------- */
.rf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.rf .dcol{gap:20px}

function tgt(b, t){

  const T0 = tgt(b, t); let temp = T0 + n, hum = null;

  if (r.type === 'miso') temp += 2.2 * Math.sin(d / 365 * 2 * Math.PI - 1) + Math.sin(t / DAY * 2 * Math.PI) * 0.5 + n;
  if (r.type === 'koji'){
    const g = 1 / (1 + Math.exp(-(d*24 - 22) / 3));
    temp = T0 - 1.4 + g*3.2 + n;
    hum = (r.hum || 85) + 3 - g*8 + n*4;

}
const devsOf = b => S.devices.filter(d => d.batch === b.id);
function currentTemp(b){

}
function currentHum(b){

  return d ? d.value : null;
}
function tick(){
  const t = now();
  for (const d of S.devices){
    // Appareil relié au pont : c'est Home Assistant qui fait foi, la simulation se tait.
    if (PONT.actif && d.eid) continue;
    if (!d.online) continue;
    d.seen = t;
    const b = S.batches.find(x => x.id === d.batch && x.status === 'active');
    if (d.kind === 'temp') d.value = b ? model(b, t).temp + (Math.random() - .5) * .05 : 17.6 + Math.sin(t/DAY*6.28) * .6;
    if (d.kind === 'hum') { const m = b && model(b, t).hum; d.value = m != null ? m + (Math.random() - .5) * .4 : 64 + (Math.random() - .5); }
  }
  for (const d of S.devices){
    if (d.kind !== 'plug' || !d.online) continue;
    const b = S.batches.find(x => x.id === d.batch && x.status === 'active');
    // Coupure de sécurité : une chauffe automatique qui n'atteint jamais sa consigne
    // (sonde qui décroche, étuve vide) s'arrête au bout de AUTO_MAX_ON minutes.
    if (PONT.actif && d.eid && d.on && d.regulDepuis && now() - d.regulDepuis > AUTO_MAX_ON){ regulerSecurite(d, b); continue; }
    if (d.mode === 'auto' && b){
      const tp = currentTemp(b), tg = b.recipe.temp;
      if (tp != null){
        const voulu = tp < tg - HYST ? true : tp > tg + HYST ? false : null;
        if (voulu !== null && voulu !== d.on){
          // Prise reliée au pont : la décision part vers Home Assistant. Elle ne se
          // contente pas d'allumer une icône, et ne réclame aucun jeton — une
          // régulation n'a personne à qui le demander. Hors pont (maquette file://),
          // la simulation reprend la main : là, aucun réseau n'est joignable.
          if (PONT.actif && d.eid) regulerPont(d, b, tp, voulu);
          else { d.on = voulu; logHeat(d, b, tp, false); }
        }

}
function status(b){

function niceStep(r){ const p = 10 ** Math.floor(Math.log10(r)); const n = r / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
function drawChart(el){

  const fill = el.classList.contains('fill'); const W = Math.max(200, el.clientWidth), H = fill ? Math.max(120, el.clientHeight) : (c.h || 220);
  const L = 46, R = 14, T = 14, B = 28, iw = W - L - R, ih = H - T - B;

    g += `<text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${c.yFmt(v, step)}</text>`;
  }
  for (let i = 0; i <= 3; i++){

function live(key){
  const [k, id] = key.split(':');
  if (k === 'dev'){
    const d = S.devices.find(x => x.id === id); if (!d) return '';
    if (d.kind === 'plug') return d.online ? (d.on ? fmt(d.power, 0) + ' W' : '0 W') : '—';
    if (d.value == null || !d.online) return '—';
    return d.kind === 'hum' ? fmt(d.value, 1) + ' %' : fmt(d.value, 2) + ' °C';
  }
  if (k === 'seen'){ const d = S.devices.find(x => x.id === id); return d ? ago(d.seen) : ''; }
  if (k === 'kpi'){ return kpiVal(id); }
  const b = S.batches.find(x => x.id === id); if (!b) return '';
  if (k === 'temp') return fmt(currentTemp(b), 1);
  if (k === 'hum') return fmt(currentHum(b), 0);
  if (k === 'heat') return heater(b) ? (devsOf(b).find(d => d.kind === 'plug').on ? 'Active' : 'Veille') : '—';
  if (k === 'delta'){

  }

/* ---------- Pont Home Assistant (même origine : /api/) ----------
   Le dashboard est servi par le cluster : nginx y expose /api/, qui parle à Home
   Assistant avec un jeton gardé dans le pod. Ouvert directement en local (file://)
   ou sans pont, rien ne répond : le dashboard garde alors exactement son
   comportement de maquette, valeurs simulées comprises. Aucune prise n'est
   commandée sans décision explicite : un clic de l'utilisateur, ou la régulation
   automatique par consigne (regulerPont) quand la prise est reliée à un lot actif et
   en mode « auto ». Rien d'autre ne touche aux relais. */
const PONT = { actif: false, disponible: null, dernier: null, jeton: null, jetonRequis: false };
const PONT_CLE = 'hakko-pont-jeton';
// Page ouverte directement (file://) : maquette pure, on ne tente aucune requête.
// Servie par le cluster, en revanche, l'état réel fait foi — et si le pont ne
// répond pas, le clic le dit au lieu de simuler une commande.
const PONT_LOCAL = location.protocol === 'file:';
const PONT_AIDE = 'Jeton du pont Home Assistant. Sur le serveur :\n'
  + 'kubectl -n scada-opus get secret pont-ha -o jsonpath="{.data.PONT_JETON}" | base64 -d';
function pontJeton(reinit){
  if (reinit){ try { localStorage.removeItem(PONT_CLE); } catch(e){} PONT.jeton = ''; }
  if (PONT.jeton == null){ try { PONT.jeton = localStorage.getItem(PONT_CLE) || ''; } catch(e){ PONT.jeton = ''; } }
  return PONT.jeton;
}
function pontDisponible(){ return PONT.disponible !== false; }
async function pontRequete(chemin, corps){
  const h = { 'Accept': 'application/json' };
  const j = pontJeton(); if (j) h['Authorization'] = 'Bearer ' + j;
  if (corps) h['Content-Type'] = 'application/json';
  return fetch('api/' + chemin, {
    method: corps ? 'POST' : 'GET', headers: h, cache: 'no-store',
    body: corps ? JSON.stringify(corps) : undefined,
  });
}
function pontApplique(reponse){
  let bascule = false;
  (reponse.appareils || []).forEach(a => {
    const d = S.devices.find(x => x.eid === a.entite); if (!d) return;
    const enLigne = a.disponible !== false;
    if (d.online !== enLigne){ d.online = enLigne; bascule = true; }
    if (d.kind === 'plug') d.on = (a.etat === 'on');
    else if (a.valeur != null) d.value = a.valeur;
    if (a.batterie != null) d.battery = Math.round(a.batterie);
  });
  PONT.actif = true; PONT.disponible = true;
  PONT.dernier = new Date((reponse.horodatage || 0) * 1000 || Date.now());
  return bascule;
}
async function pontSynchro(silencieux){
  if (PONT_LOCAL) return false;
  // Sans jeton enregistré, inutile de réessayer toutes les quinze secondes : on attend
  // le clic de l'utilisateur, qui déclenchera la demande de jeton. Cela évite aussi de
  // remplir la console de 401 alors que rien n'est cassé.
  if (silencieux && PONT.jetonRequis) return false;
  let r;
  try { r = await pontRequete('etat'); }
  catch(e){ PONT.actif = false; PONT.disponible = false; refreshLive(); return false; }
  if (r.status === 401 || r.status === 403){
    PONT.actif = false; PONT.disponible = true;
    if (silencieux){ PONT.jetonRequis = true; return false; }
    const saisi = prompt(PONT_AIDE);
    if (!saisi || !saisi.trim()) return false;
    pontJeton(true); PONT.jeton = saisi.trim(); PONT.jetonRequis = false;
    try { localStorage.setItem(PONT_CLE, PONT.jeton); } catch(e){}
    return pontSynchro(true);
  }
  if (!r.ok){ PONT.actif = false; PONT.disponible = true; refreshLive(); return false; }
  let d = null; try { d = await r.json(); } catch(e){ return false; }
  if (!d || d.ok === false){ PONT.actif = false; return false; }
  const bascule = pontApplique(d);
  save();
  if (bascule || !silencieux) render(); else refreshLive();
  return true;
}
async function pontBascule(d){
  // Sans jeton enregistré, on le demande tout de suite : envoyer la commande d'abord
  // ne produirait qu'un 401 inutile.
  if (PONT.jetonRequis){
    if (!await pontSynchro(false)) return false;
  } else {
    // On repart de l'état réel juste avant de commander : l'état affiché peut dater
    // (page restée ouverte, prise changée ailleurs), et inverser une valeur périmée
    // enverrait la commande opposée à celle voulue.
    await pontSynchro(true);
  }
  const voulu = !d.on;
  let r;
  try { r = await pontRequete('prise', { entite: d.eid, allume: voulu }); }
  catch(e){
    alert('Pont Home Assistant injoignable : « ' + d.name + ' » n\'a pas été commandée.');
    return true;
  }
  if (r.status === 401 || r.status === 403){
    if (!await pontSynchro(false)) return false;
    try { r = await pontRequete('prise', { entite: d.eid, allume: voulu }); }
    catch(e){ return false; }
  }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j || j.ok === false){
    // Une commande refusée doit se voir tout de suite : l'utilisateur vient de
    // cliquer sur une prise, il ne doit pas croire qu'elle a changé d'état.
    logEvent('alert', d.name + ' : commande refusée par le pont (HTTP ' + r.status + ')', d.batch || null);
    alert('Commande refusée par le pont Home Assistant (HTTP ' + r.status + ').\n'
      + "La prise « " + d.name + " » n'a pas changé d'état.");
    save(); render(); return true;
  }
  d.on = (j.etat === 'on'); d.mode = 'manuel';
  logEvent(d.on ? 'heat-on' : 'heat-off',
    d.name + ' : ' + (d.on ? 'activation' : 'désactivation') + ' de la prise depuis le dashboard',
    d.batch || null);
  PONT.dernier = new Date();
  save(); render(); pontSynchro(true);
  if (j.confirme === false){
    // La multiprise n'avait pas encore confirmé : on revérifie à quelques reprises
    // plutôt que de laisser à l'écran un état que Home Assistant n'a pas confirmé.
    [1500, 3500, 6000].forEach(ms => setTimeout(() => pontSynchro(true), ms));
  }
  return true;
}
/* ---------- Régulation automatique (consigne) ---------- */
/* La page décide, le pont exécute. Trois freins, parce qu'il s'agit d'un relais réel :
   une seule commande à la fois, au plus une par minute sur la même prise (un relais qui
   claque use ses contacts sans jamais atteindre sa consigne), et une coupure de sécurité
   après AUTO_MAX_ON minutes de chauffe continue — une sonde qui décroche ne doit pas
   transformer l'étuve en four. Une commande refusée ou un pont injoignable ne se réessaie
   pas en boucle : c'est écrit dans le journal du dashboard et visible à l'écran. */
let regulEnCours = false;
async function regulerPont(d, b, tp, voulu, securite){
  const t = now();
  if (regulEnCours) return;
  if (securite !== true){
    if (d.regulPause && t < d.regulPause) return;
    if (d.regulRefus && t - d.regulRefus < AUTO_REFUS) return;
    if (d.regulT && t - d.regulT < AUTO_COOLDOWN) return;
  }
  regulEnCours = true; d.regulT = t;
  try {
    const r = await pontRequete('prise', { entite: d.eid, allume: voulu });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || j.ok === false) throw new Error('HTTP ' + r.status);
    d.on = (j.etat === 'on'); d.regulDepuis = d.on ? t : null;
    logHeat(d, b, tp, false);
    if (securite === true) logEvent('alert', d.name + ' : chauffe automatique interrompue après '
      + Math.round(AUTO_MAX_ON / 60000) + ' min sans atteindre la consigne', b ? b.id : null);
    save(); render();
    if (j.confirme === false) [1500, 3500].forEach(ms => setTimeout(() => pontSynchro(true), ms));
  } catch(e){
    d.regulRefus = t;
    logEvent('alert', d.name + ' : régulation automatique sans effet (' + e.message + ')', b ? b.id : null);
    save(); render();
  } finally { regulEnCours = false; }
}
function regulerSecurite(d, b){
  // Le relais retombe tout de suite (on ne poireaute pas une minute de plus), puis la
  // régulation se tait un moment au lieu de relancer aussitôt un cycle identique.
  d.regulPause = now() + AUTO_PAUSE; d.regulDepuis = null;
  regulerPont(d, b, currentTemp(b), false, true);
}

          ${act.length ? `<div class="lots scroll">${lots}</div>` : `<div class="empty"><strong>Aucune fermentation en cours</strong>Lancez-en une depuis une recette.</div>`}</section>

}

/* ---------- Detail ---------- */
function detail(id){
  const b = S.batches.find(x => x.id === id);
  if (!b){ setCrumbs([['Vue d’ensemble', '#/'], ['Introuvable']]); return `<div class="card empty"><strong>Fermentation introuvable</strong>Elle a peut-être été supprimée.</div>`; }
  if (b.status === 'done'){ setTimeout(() => location.replace('#/archive/' + b.id)); return ''; }
  setCrumbs([['Vue d’ensemble', '#/'], [b.name]]);
  const r = b.recipe, T = TYPES[r.type], p = progress(b), active = b.status === 'active';
  const unit = r.duration < 3 ? 4 / 24 : r.duration > 90 ? 7 : 1;
  const cells = Math.ceil(r.duration / unit), cur = Math.floor(p.el / unit);
  let strip = ''; for (let i = 0; i < cells; i++) strip += `<span class="${i < cur || !active ? 'past' : i === cur ? 'now' : ''}" title="${unit < 1 ? (i*4) + ' h' : unit === 7 ? 'Semaine ' + (i+1) : 'Jour ' + (i+1)}"></span>`;
  const remain = Math.max(0, p.endAt - (active ? now() : b.end)) / DAY;

  const kp = [];
  kp.push(['Température', `<span ${active ? `data-live="temp:${b.id}"` : ''}>${fmt(currentTemp(b), 1)}</span><small>°C</small>`, `<span ${active ? `data-live="delta:${b.id}"` : ''}>${live('delta:' + b.id)}</span>`]);
  kp.push(['Consigne', `${fmt(r.temp, 1)}<small>°C</small>`, `Tolérance ±${fmt(TYPES[r.type].tol / 2, 1)} °C`]);
  if (r.type === 'koji') kp.push(['Humidité', `<span ${active ? `data-live="hum:${b.id}"` : ''}>${fmt(currentHum(b), 0)}</span><small>%</small>`, `Cible ${r.hum} %`]);
  if (r.type === 'biere' && b.gravity?.length){
    const g = b.gravity.at(-1)[1], abv = (r.og - g) * 131.25, att = (r.og - g) / (r.og - 1) * 100;
    kp.push(['Densité', fmt(g, 3), `Visée ${fmt(r.fg, 3)}`], ['Alcool estimé', `${fmt(abv, 1)}<small>%</small>`, `Atténuation ${fmt(att, 0)} %`]);
  }
  if (r.salt) kp.push(['Salinité', `${fmt(r.salt, 0)}<small>%</small>`, 'Du poids total']);
  kp.push(['Chauffage', `<span ${active ? `data-live="heat:${b.id}"` : ''}>${live('heat:' + b.id)}</span>`, `Hystérésis ±${fmt(HYST, 1)} °C`]);

  const tabs = [['temp', 'Température']];
  if (r.type === 'koji') tabs.push(['hum', 'Humidité']);
  if (r.type === 'biere') tabs.push(['grav', 'Densité']);
  if (!tabs.find(t => t[0] === detailChart)) detailChart = 'temp';
  const ranges = r.duration < 3 ? [['24h', '24 h'], ['tout', 'Tout']] : [['24h', '24 h'], ['7j', '7 j'], ['tout', 'Tout']];
  if (!ranges.find(x => x[0] === detailRange)) detailRange = '24h';

  const params = [['Recette', `<a href="#/recettes/${r.id}" style="color:var(--accent)">${esc(r.name)}</a>`], ['Durée prévue', fmtDur(r.duration)], ['Consigne', fmt(r.temp, 1) + ' °C']];
  if (r.type === 'biere') params.push(['Densité initiale', fmt(r.og, 3)], ['Densité finale', fmt(r.fg, 3)], ['Volume', (r.volume || '—') + ' L']);
  if (r.type === 'koji') params.push(['Humidité', r.hum + ' %']);
  if (r.salt) params.push(['Salinité', r.salt + ' %']);
  params.push(['Démarrée le', fmtDateY(b.start)]);
  const devs = devsOf(b);
  const lc = detailChart === 'hum' ? 'var(--accent)' : T.c;

  setTimeout(() => { const el = document.getElementById('chart-main'); if (el){ el._cfg = () => chartCfg(b); drawChart(el); mountCharts(); } });

  return `<div class="dp" style="--c:${T.c}">
    <div class="dp-head">
      <div class="dp-title"><h1>${esc(b.name)}</h1><span class="type"><i></i>${T.label}</span>${stateBadge(b, true)}
        <span class="dp-sub num">Démarrée le ${fmtDateY(b.start)} à ${fmtTime(b.start)}${!active ? `, terminée le ${fmtDateY(b.end)}` : ''}</span></div>
      <div class="ph-actions">${active ? `<button class="btn" data-action="finish" data-id="${b.id}">Terminer le lot</button>` : `<button class="btn danger" data-action="delete-batch" data-id="${b.id}">Supprimer</button>`}</div>
    </div>

    <div class="kpis compact">${kp.map(([k, v, s]) => `<div class="card kpi"><div class="k">${k}</div><div class="v num">${v}</div><div class="s num">${s}</div></div>`).join('')}</div>

    <div class="dp-grid">
      <section class="card dp-chart">
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-action="ctab" data-v="${k}" aria-selected="${detailChart === k}">${l}</button>`).join('')}
          <span class="tabs-end">${detailChart !== 'grav' ? `<span class="seg">${ranges.map(([k, l]) => `<button data-action="range" data-r="${k}" aria-pressed="${detailRange === k}">${l}</button>`).join('')}</span>` : ''}</span></div>
        <div class="dp-chart-body ${detailChart === 'grav' ? 'with-side' : ''}">
          <div class="dp-plot">
            <div class="chart fill" id="chart-main" data-chart ${active && detailChart !== 'grav' ? 'data-live2' : ''}></div>
            <div class="legend" style="--c:${lc}"><span><i></i>${detailChart === 'temp' ? 'Mesure' : detailChart === 'hum' ? 'Humidité relative' : 'Relevés de densité'}</span><span><i class="dash"></i>${detailChart === 'grav' ? 'Densité visée' : 'Consigne'}</span>${detailChart === 'temp' ? '<span><i class="band"></i>Plage tolérée</span>' : ''}</div>
          </div>
          ${detailChart === 'grav' ? gravHTML(b, active) : ''}
        </div>
      </section>

      <section class="card dp-journal scroll-card"><div class="card-h"><h2>Journal</h2>
          <span class="seg">${[['all','Tout'],['note','Notes'],['heat','Chauffe'],['target','Consigne']].map(([k, l]) => `<button data-action="jfilter" data-v="${k}" aria-pressed="${journalFilter === k}">${l}</button>`).join('')}</span></div>
        <ul class="notes journal scroll" id="journal-list" data-b="${b.id}">${journalHTML(b)}</ul>
        <form class="note-form" data-form="note" data-id="${b.id}"><input type="text" name="x" placeholder="Ajouter une observation" required aria-label="Nouvelle note"><button class="btn">Ajouter</button></form></section>

      <section class="card dp-devs scroll-card"><div class="card-h"><h2>Appareils reliés<span class="sub num">${devs.length}</span></h2><a class="btn ghost sm" href="#/appareils">Gérer</a></div>
        <div class="scroll">${devs.length ? `<table class="data"><tbody>${devs.map(d => `<tr><td><div class="dev-cell"><span class="dev-ic">${IC[d.kind]}</span><div><div class="nm">${esc(d.name)}</div><div class="sm">${d.online ? (d.kind === 'plug' ? (d.mode === 'auto' ? 'Mode auto' : 'Mode manuel') : 'En ligne') : 'Hors ligne'}</div></div></div></td><td class="r num" data-live="dev:${d.id}">${live('dev:' + d.id)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Aucun appareil relié.</div>'}</div></section>

      <div class="dp-side">
        ${active ? `<section class="card"><div class="card-h"><h2>Consigne</h2><span class="muted num">Actuelle ${fmt(r.temp, 1)} °C</span></div>
          <form class="card-b" data-form="target" data-id="${b.id}">
            <div class="tset"><div class="stepper"><button type="button" data-action="tstep" data-d="-0.5" aria-label="Baisser de 0,5 °C">−</button><input type="number" name="t" step="0.5" min="-5" max="100" value="${r.temp}" aria-label="Nouvelle consigne en °C"><span>°C</span><button type="button" data-action="tstep" data-d="0.5" aria-label="Monter de 0,5 °C">+</button></div>
            <button class="btn primary">Appliquer</button></div>
            <p class="hint num">Chauffe active sous ${fmt(r.temp - HYST, 1)} °C, coupée au-dessus de ${fmt(r.temp + HYST, 1)} °C.</p>
          </form></section>` : ''}
        <section class="card"><div class="card-h"><h2>Progression</h2><span class="muted num">${Math.round(p.frac * 100)} %</span></div>
          <div class="card-b"><div class="prog-top"><strong class="num">${p.label}</strong></div>
            <div class="strip" aria-label="${Math.round(p.frac * 100)} % de la durée prévue">${strip}</div>
            <div class="dates num"><div><div class="k">Début</div><div class="v">${fmtDate(b.start)}</div></div><div><div class="k">${active ? 'Restant' : 'Durée'}</div><div class="v">${active ? (remain > 0 ? fmtDur(remain) : 'Échu') : fmtDur((b.end - b.start) / DAY)}</div></div><div><div class="k">${active ? 'Fin prévue' : 'Fin'}</div><div class="v">${fmtDate(active ? p.endAt : b.end)}</div></div></div></div></section>
        <section class="card scroll-card dp-params"><div class="card-h"><h2>Paramètres</h2></div><div class="scroll"><dl class="kv num">${params.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></section>
      </div>
    </div>
  </div>`;
}
function chartCfg(b){
  return detailChart === 'hum' ? humCfg(b) : detailChart === 'grav' ? gravCfg(b) : tempCfg(b);
}
const dtLocal = t => { const d = new Date(t - new Date(t).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
function gravHTML(b, active){
  const r = b.recipe, list = (b.gravity || []).slice().sort((a, c) => c[0] - a[0]);
  return `<div class="grav-side">
    ${active ? `<form class="grav-form" data-form="gravity" data-id="${b.id}">
      <label class="field"><span>Densité mesurée</span><input type="number" name="g" step="0.001" min="0.990" max="1.150" placeholder="1.007" required></label>
      <label class="field"><span>Date de la mesure</span><input type="datetime-local" name="d" value="${dtLocal(now())}" max="${dtLocal(now())}" required></label>
      <button class="btn">Ajouter le relevé</button></form>` : ''}
    <div class="scroll grav-list"><table class="data"><thead><tr><th>Date</th><th class="r">Densité</th><th class="r">Alcool</th><th></th></tr></thead><tbody>
    ${list.map(([t, g]) => `<tr><td class="num sm">${fmtDate(t)}, ${fmtTime(t)}</td><td class="r num nm">${fmt(g, 3)}</td><td class="r num">${fmt((r.og - g) * 131.25, 1)} %</td><td class="r">${active ? `<button type="button" class="icon-btn bare" data-action="rm-grav" data-id="${b.id}" data-t="${t}" aria-label="Supprimer ce relevé">${IC.x}</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
let journalFilter = 'all';
function journalHTML(b, jf){
  jf = jf || journalFilter;
  let items = b.notes.map(n => ({t:n.t, k:'note', x:n.x}));
  S.events.filter(e => e.b === b.id && (((e.k === 'heat-on' || e.k === 'heat-off') && e.tp != null) || e.k === 'target')).forEach(e => items.push(e));
  if (jf === 'note') items = items.filter(i => i.k === 'note');
  if (jf === 'heat') items = items.filter(i => i.k === 'heat-on' || i.k === 'heat-off');
  if (jf === 'target') items = items.filter(i => i.k === 'target');
  items.sort((a, c) => c.t - a.t);
  if (!items.length) return '<li class="muted">Aucune entrée.</li>';
  return items.slice(0, 150).map(i => {
    let body, tag;
    if (i.k === 'note'){ tag = '<span class="badge">Note</span>'; body = esc(i.x); }
    else if (i.k === 'target'){ tag = '<span class="badge acc">Consigne</span>'; body = `Consigne modifiée de ${fmt(i.from, 1)} °C à <strong>${fmt(i.to, 1)} °C</strong>`; }
    else {
      const dl = i.tp - i.tg, on = i.k === 'heat-on';
      tag = `<span class="badge ${on ? 'warn' : ''}">${on ? 'Chauffe on' : 'Chauffe off'}</span>`;
      body = `<strong>${fmt(i.tp, 1)} °C</strong> (${dl >= 0 ? '+' : '−'}${fmt(Math.abs(dl), 1)} °C) - ${on ? 'Activation' : 'Désactivation'} de la chauffe${i.manual ? ', manuelle' : ''}`;
    }
    return `<li class="jl"><time class="num">${fmtDate(i.t)}, ${fmtTime(i.t)}</time>${tag}<span class="num jt">${body}</span></li>`;
  }).join('');
}

/* ---------- Recipes ---------- */
function recipes(){

  const act = S.recipes.filter(r => !r.archived), arc = S.recipes.filter(r => r.archived);
  let list = recipeTab === 'actives' ? act : arc;

  if (recipeQuery) list = list.filter(r => (r.name + ' ' + (r.desc || '')).toLowerCase().includes(recipeQuery.toLowerCase()));
  const runs = id => S.batches.filter(b => b.recipeId === id);
  const rows = list.map(r => {
    const T = TYPES[r.type], rs = runs(r.id), last = rs.length ? Math.max(...rs.map(b => b.start)) : null;
    const spec = r.type === 'biere' ? `${fmt(r.og, 3)} → ${fmt(r.fg, 3)}` : r.type === 'koji' ? `${r.hum} % HR` : `${r.salt} % sel`;
    return `<tr class="click" data-href="#/recettes/${r.id}"><td class="first"><div class="nm">${esc(r.name)}</div><div class="sm" style="max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.desc || '')}</div></td>

        <label class="search">${IC.search}<input type="search" id="rsearch" placeholder="Rechercher" value="${esc(recipeQuery)}" aria-label="Rechercher une recette"></label>

        <span class="seg"><button data-action="rtype" data-v="all" aria-pressed="${recipeType === 'all'}">Tous</button>${Object.entries(TYPES).map(([k, T]) => `<button data-action="rtype" data-v="${k}" aria-pressed="${recipeType === k}">${T.label}</button>`).join('')}</span>
      </div>
      ${rows ? `<div class="tbl-wrap"><table class="data stack"><thead><tr><th>Nom</th><th>Type</th><th>Durée</th><th>Température</th><th>Paramètre clé</th><th class="r">Lancements</th><th class="r">Dernier lancement</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty"><strong>${recipeQuery || recipeType !== 'all' ? 'Aucune recette ne correspond aux filtres' : recipeTab === 'actives' ? 'Aucune recette active' : 'Aucune recette archivée'}</strong>${recipeTab === 'actives' ? 'Créez une recette avec le bouton Nouvelle recette.' : 'Les recettes archivées apparaîtront ici.'}</div>`}
    </section>`;
}
function ingRow(i = {}){ return `<div class="rrow"><input type="text" name="in" value="${esc(i.n)}" placeholder="Ingrédient" aria-label="Ingrédient"><input type="text" name="iq" value="${esc(i.q)}" placeholder="Quantité" aria-label="Quantité"><button type="button" class="icon-btn bare" data-action="rm-row" aria-label="Retirer">${IC.x}</button></div>`; }
function stepRow(s = '', n = 1){ return `<div class="rrow step"><span class="ix num">${n}</span><input type="text" name="st" value="${esc(s)}" placeholder="Décrire l’étape" aria-label="Étape ${n}"><button type="button" class="icon-btn bare" data-action="rm-row" aria-label="Retirer">${IC.x}</button></div>`; }

/* ---------- Archive ---------- */
let archType = 'all', archQuery = '';
const statsCache = new Map();
function setAt(b, t){
  const L = b.targets; if (!L || !L.length) return b.recipe.temp;
  let v = L[0][1]; for (const [tc, nv] of L) if (tc <= t) v = nv; return v;
}
function archStats(b){
  const key = b.id + ':' + b.end + ':' + (b.targets ? b.targets.length : 0);
  if (statsCache.has(key)) return statsCache.get(key);
  const r = b.recipe, tol = TYPES[r.type].tol / 2, end = b.end, span = end - b.start;
  const n = 160, pts = [], hum = [], pmin = [], pmax = [];
  let sum = 0, sq = 0, min = Infinity, max = -Infinity, inR = 0, hs = 0, hc = 0;
  const K = 40, raw = [];
  for (let i = 0; i <= n; i++){
    const t = b.start + span * i / n; let at = 0, ah = 0, hk = 0, lo = Infinity, hi = -Infinity;
    for (let k = 0; k < K; k++){
      const tt = Math.min(end, t + (k - K / 2) * span / n / K), m = model(b, tt);
      raw.push([tt, m.temp]); at += m.temp; lo = Math.min(lo, m.temp); hi = Math.max(hi, m.temp); sum += m.temp; sq += m.temp * m.temp;
      min = Math.min(min, m.temp); max = Math.max(max, m.temp);
      if (Math.abs(m.temp - setAt(b, tt)) <= tol) inR++;
      if (m.hum != null){ ah += m.hum; hk++; hs += m.hum; hc++; }
    }
    pts.push([t, at / K]); pmin.push([t, lo]); pmax.push([t, hi]); if (hk) hum.push([t, ah / hk]);
  }
  const N = (n + 1) * K, avg = sum / N, sd = Math.sqrt(Math.max(0, sq / N - avg * avg));
  inR = inR / N * (n + 1);
  // Chauffe : simulation de l'hystérésis sur toute la durée
  let heat = null;
  if ((b.devSnap || []).some(d => d.kind === 'plug')){
    let on = false, acts = 0, onMs = 0; const st = Math.max(5 * 60e3, span / 20000);
    for (let t = b.start; t < end; t += st){
      const tp = model(b, t).temp, tg = setAt(b, t);
      if (!on && tp < tg - HYST){ on = true; acts++; } else if (on && tp > tg + HYST) on = false;
      if (on) onMs += st;
    }
    heat = {acts, hours: onMs / HOUR, duty: onMs / span * 100};
  }
  // Agrégats journaliers (ou par 4 h si lot court)
  const bucket = span < 3 * DAY ? 4 * HOUR : span > 90 * DAY ? 7 * DAY : DAY;
  const daily = [];
  for (let t0 = b.start; t0 < end; t0 += bucket){
    const seg = raw.filter(p => p[0] >= t0 && p[0] < t0 + bucket); if (seg.length < 40) continue;
    const v = seg.map(p => p[1]);
    daily.push({t:t0 + bucket / 2, avg:v.reduce((a, c) => a + c, 0) / v.length, min:Math.min(...v), max:Math.max(...v)});
  }
  const s = {pts, pmin, pmax, hum, avg, sd, min, max, inRange: inR / (n + 1) * 100, humAvg: hc ? hs / hc : null, heat, daily, bucket, span};
  statsCache.set(key, s); return s;
}
function archResult(b){
  const r = b.recipe;
  if (r.type === 'biere' && b.gravity?.length){ const g = b.gravity.at(-1)[1]; return `${fmt(g, 3)}, ${fmt((r.og - g) * 131.25, 1)} %`; }
  if (r.type === 'koji'){ const s = archStats(b); return s.humAvg != null ? `${fmt(s.humAvg, 0)} % HR moy.` : '—'; }
  return r.salt ? `${fmt(r.salt, 0)} % sel` : '—';
}
function archive(){
  setCrumbs([['Archive']]);
  const all = S.batches.filter(b => b.status === 'done').sort((a, c) => c.end - a.end);
  let list = all;
  if (archType !== 'all') list = list.filter(b => b.recipe.type === archType);
  if (archQuery) list = list.filter(b => (b.name + ' ' + b.recipe.name).toLowerCase().includes(archQuery.toLowerCase()));
  const rows = list.map(b => {
    const T = TYPES[b.recipe.type], s = archStats(b), ir = s.inRange;
    return `<tr class="click" data-href="#/archive/${b.id}">
      <td class="first"><div class="nm">${esc(b.name)}</div><div class="sm">${esc(b.recipe.name)}</div></td>

      <div class="toolbar">
        <label class="search">${IC.search}<input type="search" id="asearch" placeholder="Rechercher un lot" value="${esc(archQuery)}" aria-label="Rechercher un lot archivé"></label>

      </div>
      ${rows ? `<div class="tbl-wrap"><table class="data stack"><thead><tr><th>Lot</th><th>Type</th><th>Période</th><th>Durée</th><th>Temp. moyenne</th><th>Dans la plage</th><th class="r">Résultat</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty"><strong>${all.length ? 'Aucun lot ne correspond aux filtres' : 'Aucun lot archivé'}</strong>${all.length ? '' : 'Un lot arrive ici quand vous cliquez sur Terminer le lot.'}</div>`}
    </section>`;
}
function archiveDetail(id){

  const params = [['Recette', esc(r.name)], ['Durée prévue', fmtDur(r.duration)], ['Consigne finale', fmt(r.temp, 1) + ' °C']];
  if (b.targets && b.targets.length > 1) params.push(['Changements de consigne', String(b.targets.length - 1)]);
  if (r.type === 'biere') params.push(['Densité initiale', fmt(r.og, 3)], ['Densité finale visée', fmt(r.fg, 3)], ['Volume', (r.volume || '—') + ' L']);

  const T2 = second[1] === 'hum' ? 'var(--accent)' : T.c;
  return `<div class="dp" style="--c:${T.c}">

}
function archTempCfg(b){
  const s = archStats(b), r = b.recipe, tol = TYPES[r.type].tol / 2, c = TYPES[r.type].c, long = s.span > 2 * DAY;
  return {color:c, series:[{pts:s.pts, color:c, w:2}, {pts:s.pmax, color:'var(--faint)', w:1}, {pts:s.pmin, color:'var(--faint)', w:1}], band:[r.temp - tol, r.temp + tol], lines:[{y:r.temp, label:'consigne ' + fmt(r.temp, 1) + ' °C'}],
    yFmt:(v, st) => fmt(v, st < 1 ? 1 : 0) + '°', xFmt:t => long ? fmtDate(t) : fmtTime(t),
    tip:p => { const i = s.pts.findIndex(x => x[0] === p[0]); return `Moy. ${fmt(p[1], 1)} °C (${fmt(s.pmin[i][1], 1)} à ${fmt(s.pmax[i][1], 1)}), ${fmtDate(p[0])} ${fmtTime(p[0])}`; }, label:'Température archivée'};
}
function archSecondCfg(b, kind){
  const s = archStats(b), r = b.recipe, c = TYPES[r.type].c;
  if (kind === 'grav') return Object.assign(gravCfg(b), {x0:b.start, x1:b.end});
  if (kind === 'hum') return {color:'var(--accent)', series:[{pts:s.hum, color:'var(--accent)', area:true}], lines:[{y:r.hum, label:'cible ' + r.hum + ' %'}],
    yFmt:v => fmt(v, 0) + ' %', xFmt:fmtTime, tip:p => `${fmt(p[1], 0)} % HR, ${fmtDate(p[0])} ${fmtTime(p[0])}`, label:'Humidité archivée'};
  const f = s.bucket < DAY ? t => fmtTime(t) : t => fmtDate(t);
  return {color:c, series:[
      {pts:s.daily.map(d => [d.t, d.avg]), color:c, w:2},
      {pts:s.daily.map(d => [d.t, d.max]), color:'var(--faint)', w:1},
      {pts:s.daily.map(d => [d.t, d.min]), color:'var(--faint)', w:1}],
    lines:[{y:r.temp, label:'consigne'}], yFmt:(v, st) => fmt(v, st < 1 ? 1 : 0) + '°', xFmt:f,
    tip:p => { const d = s.daily.find(x => x.t === p[0]); return d ? `Moy. ${fmt(d.avg, 1)}, min ${fmt(d.min, 1)}, max ${fmt(d.max, 1)} °C` : ''; }, label:'Températures agrégées'};
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('select,button,input,a')){ location.hash = tr.dataset.href; return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action, id = a.dataset.id;
  if (act === 'theme') return cycleTheme();
  if (act === 'range'){ detailRange = a.dataset.r; a.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === a)); drawChart(document.getElementById('chart-main')); return; }
  if (act === 'ctab'){ detailChart = a.dataset.v; render(); return; }
  if (act === 'finish'){
    if (!confirm('Terminer ce lot ? Il sera déplacé dans l’Archive et les appareils reliés seront libérés.')) return;
    const b = S.batches.find(x => x.id === id); b.status = 'done'; b.end = now();
    b.devSnap = devsOf(b).map(d => ({name:d.name, kind:d.kind}));
    S.devices.forEach(d => { if (d.batch === id){ d.batch = null; if (d.kind === 'plug') d.on = false; } });
    logEvent('batch', 'Lot terminé et archivé : ' + b.name, b.id); save(); location.hash = '#/archive/' + b.id; return;
  }
  if (act === 'delete-batch'){ if (!confirm('Supprimer définitivement ce lot ?')) return; S.batches = S.batches.filter(x => x.id !== id); save(); location.hash = '#/'; return; }
  if (act === 'jfilter'){ journalFilter = a.dataset.v; a.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === a)); const jl = document.getElementById('journal-list'); jl.innerHTML = jl._h = journalHTML(S.batches.find(x => x.id === jl.dataset.b)); return; }
  if (act === 'tstep'){ const inp = a.parentElement.querySelector('input'); inp.value = (Math.round(((parseFloat(inp.value) || 0) + parseFloat(a.dataset.d)) * 2) / 2).toString(); return; }
  if (act === 'rm-grav'){ const b = S.batches.find(x => x.id === id); b.gravity = b.gravity.filter(g => String(g[0]) !== a.dataset.t); save(); render(); return; }
  if (act === 'atype'){ archType = a.dataset.v; render(); return; }
  if (act === 'rtab'){ recipeTab = a.dataset.v; render(); return; }
  if (act === 'rtype'){ recipeType = a.dataset.v; render(); return; }
  if (act === 'dfilter'){ devFilter = a.dataset.v; render(); return; }
  if (act === 'add-ing'){ document.getElementById('ings').insertAdjacentHTML('beforeend', ingRow()); document.querySelector('#ings .rrow:last-child input').focus(); return; }
  if (act === 'add-step'){ const s = document.getElementById('steps'); s.insertAdjacentHTML('beforeend', stepRow('', s.children.length + 1)); s.querySelector('.rrow:last-child input').focus(); return; }
  if (act === 'rm-row'){ a.closest('.rrow').remove(); renumber(); return; }
  if (act === 'archive'){ const r = S.recipes.find(x => x.id === id); r.archived = !r.archived; save(); recipeTab = r.archived ? 'archivees' : 'actives'; location.hash = '#/recettes'; return; }
  if (act === 'launch'){
    const r = S.recipes.find(x => x.id === id), n = S.batches.filter(b => b.recipeId === id).length + 1;
    const b = {id:uid('b'), name:`${r.name} #${n}`, recipe:JSON.parse(JSON.stringify(r)), recipeId:r.id, start:now(), status:'active', notes:[], gravity:r.type === 'biere' ? [[now(), r.og]] : undefined};
    S.batches.push(b); logEvent('batch', 'Fermentation lancée : ' + b.name, b.id); save(); location.hash = '#/f/' + b.id; return;
  }
  if (act === 'add-dev') return openAddDevice();
  if (act === 'close-dlg') return document.getElementById('dlg').close();
  if (act === 'toggle-plug'){
    const p = S.devices.find(x => x.id === id); if (!p.online) return;
    // Prise reliée à Home Assistant : la commande part vers le pont, l'état affiché
    // est celui que Home Assistant renvoie. Sans pont joignable (page ouverte en
    // local), on retombe sur le comportement de la maquette.
    if (p.eid && !PONT_LOCAL){ pontBascule(p); return; }
    const d = p; d.on = !d.on; d.mode = 'manuel'; const b = S.batches.find(x => x.id === d.batch && x.status === 'active'); logHeat(d, b, b ? currentTemp(b) : null, true); tick(); save(); render(); return; }
  if (act === 'rm-dev'){ const d = S.devices.find(x => x.id === id); if (!confirm(`Retirer « ${d.name} » ?`)) return; S.devices = S.devices.filter(x => x.id !== id); save(); render(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-action="assign"]')){ const d = S.devices.find(x => x.id === t.dataset.id); d.batch = t.value || null; if (!d.batch && d.kind === 'plug') d.on = false; tick(); save(); render(); }
  if (t.matches('[data-action="plug-mode"]')){ const d = S.devices.find(x => x.id === t.dataset.id); d.mode = t.value; tick(); save(); render(); }
  if (t.name === 'type' && t.closest('#rform')) t.closest('#rform').dataset.type = t.value;
});
document.addEventListener('input', e => {
  if (e.target.id === 'asearch'){ archQuery = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById('asearch'); s.focus(); s.setSelectionRange(pos, pos); return; }
  if (e.target.id === 'rsearch'){ recipeQuery = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById('rsearch'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === 'note'){ const b = S.batches.find(x => x.id === f.dataset.id); const x = fd.get('x').trim(); if (!x) return; b.notes.push({t:now(), x}); save(); render(); return; }
  if (f.dataset.form === 'gravity'){
    const b = S.batches.find(x => x.id === f.dataset.id); const g = parseFloat(String(fd.get('g')).replace(',', '.'));
    if (!(g > .98 && g < 1.2)) return;
    let t = new Date(fd.get('d')).getTime(); if (isNaN(t)) t = now(); t = Math.min(Math.max(t, b.start), now());
    b.gravity = (b.gravity || []).concat([[t, g]]).sort((a, c) => a[0] - c[0]); save(); render(); return;
  }
  if (f.dataset.form === 'target'){
    const b = S.batches.find(x => x.id === f.dataset.id); const v = parseFloat(String(fd.get('t')).replace(',', '.'));
    if (isNaN(v) || v < -5 || v > 100 || v === b.recipe.temp) return;
    if (!b.targets) b.targets = [[b.start, b.recipe.temp]];
    const from = b.recipe.temp; b.targets.push([now(), v]); b.recipe.temp = v;
    logEvent('target', `${b.name} : consigne modifiée de ${fmt(from, 1)} à ${fmt(v, 1)} °C`, b.id, {from, to:v});
    tick(); save(); render(); return;
  }
  if (f.dataset.form === 'device'){
    const name = fd.get('name').trim(); if (!name) return; const kind = fd.get('kind');
    const d = {id:uid(kind[0]), name, kind, batch:fd.get('batch') || null, online:true, seen:now()};
    if (kind === 'plug'){ d.mode = d.batch ? 'auto' : 'manuel'; d.on = false; const used = outlets().map(o => o.slot); const free = [1, 2, 3, 4, 5].find(s => !used.includes(s)); if (free) d.slot = free; } else d.battery = 100;
    S.devices.push(d); document.getElementById('dlg').close(); tick(); save(); render(); return;
  }
  if (f.id === 'rform'){
    const num = k => { const v = parseFloat(String(fd.get(k)).replace(',', '.')); return isNaN(v) ? null : v; };
    const name = fd.get('name').trim(), err = document.getElementById('ferr');
    if (!name){ err.textContent = 'Donnez un nom à la recette pour l’enregistrer.'; f.querySelector('[name=name]').focus(); return; }
    const duration = num('duration'), temp = num('temp');
    if (!duration || duration <= 0){ err.textContent = 'Indiquez une durée prévue supérieure à zéro.'; return; }
    if (temp == null){ err.textContent = 'Indiquez une température cible.'; return; }
    const type = fd.get('type'), ins = fd.getAll('in'), iqs = fd.getAll('iq');
    const r = {type, name, desc:fd.get('desc').trim(), duration, temp,
      ingredients:ins.map((n, i) => ({n:n.trim(), q:iqs[i].trim()})).filter(i => i.n),
      steps:fd.getAll('st').map(s => s.trim()).filter(Boolean)};
    if (type === 'biere'){ r.og = num('og'); r.fg = num('fg'); r.volume = num('volume'); }
    if (type === 'koji') r.hum = num('hum');
    if (type === 'miso' || type === 'garum') r.salt = num('salt');
    const id = f.dataset.id;
    if (id){ const o = S.recipes.find(x => x.id === id); Object.keys(o).forEach(k => { if (!['id', 'archived'].includes(k)) delete o[k]; }); Object.assign(o, r); }
    else S.recipes.push({id:uid('r'), archived:false, ...r});
    save(); recipeTab = 'actives'; location.hash = '#/recettes';
  }
});

/* ---------- Theme ---------- */
const themes = ['auto', 'light', 'dark'];
let theme = 'auto'; try { theme = localStorage.getItem('hakko-theme') || 'auto'; } catch(e) {}
function applyTheme(){
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  const b = document.getElementById('themeBtn'); b.innerHTML = theme === 'auto' ? IC.auto : theme === 'light' ? IC.sun : IC.moon;
  b.title = theme === 'auto' ? 'Thème automatique' : theme === 'light' ? 'Thème clair' : 'Thème sombre';
}
function cycleTheme(){ theme = themes[(themes.indexOf(theme) + 1) % 3]; try { localStorage.setItem('hakko-theme', theme); } catch(e) {} applyTheme(); document.querySelectorAll('[data-chart]').forEach(drawChart); }

/* ---------- Boot ---------- */
document.querySelectorAll('.brand-mark').forEach(e => e.innerHTML = MARK);
applyTheme();
tick();
render();
refreshLive();
pontSynchro(true);   // si un pont répond, les appareils réels prennent la main
let ticPont = 0;
setInterval(() => { tick(); save(); refreshLive(); if (++ticPont % 5 === 0) pontSynchro(true); }, 3000);

</script>
