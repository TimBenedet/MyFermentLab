apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-opus
  namespace: scada-opus
  labels:
    app: scada-opus
    app.kubernetes.io/part-of: myfermentlab
spec:
  # UNE seule réplique, et c'est délibéré : le pont régule désormais lui-même
  # (il tient la consigne sans qu'aucune page soit ouverte). Deux pods voudraient
  # dire deux régulateurs commandant les mêmes prises, et nginx répartirait le plan
  # déposé par la page entre les deux — l'un chaufferait donc sur un plan que l'autre
  # n'a pas. Le prix est un dashboard indisponible quelques secondes à chaque
  # redémarrage de pod ; c'est moins grave que deux régulateurs concurrents.
  replicas: 1
  # Recreate, et non RollingUpdate : avec maxSurge: 1, le nouveau pod démarre AVANT que
  # l'ancien s'arrête — donc deux régulateurs commandent les mêmes prises pendant le
  # basculement, exactement ce que replicas: 1 veut empêcher. Le verrou d'écriture protège
  # le document, pas les relais. Le prix est une interruption de quelques secondes du
  # dashboard à chaque déploiement ; c'est moins grave que deux régulateurs concurrents.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scada-opus
  template:
    metadata:
      labels:
        app: scada-opus
    spec:
      containers:
        - name: nginx
          # Le tag est réécrit automatiquement par la CI (voir .github/workflows/build-scada-opus.yml)
          # puis appliqué par ArgoCD : ne pas modifier à la main.
          image: ghcr.io/timbenedet/myfermentlab-scada:latest
          # IfNotPresent : une fois le tag immuable épinglé par la CI, un redémarrage de pod
          # ne dépend plus de la disponibilité de GHCR. (« latest » n'est là que pour
          # amorcer le tout premier déploiement.)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
        # Le « pont » : seul composant qui connaît le jeton de Home Assistant.
        # Il n'est pas exposé par le Service (seul le port 80 de nginx l'est) :
        # on n'y accède que par nginx, donc sur /api/ et sur la même origine.
        - name: pont
          # Tag réécrit automatiquement par la CI, comme celui du site.
          image: ghcr.io/timbenedet/myfermentlab-pont:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HASS_URL
              value: http://192.168.1.51:8123
            # Le secret est créé hors GitOps (voir DEPLOIEMENT.md) : un jeton ne se
            # commite pas. Créé avant le premier déploiement du pont, sinon le pod
            # ne démarre pas (secretKeyRef non optionnel).
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pont-ha
                  key: HASS_TOKEN
            # PONT_AUTH=jeton : exigé par le partage de données. En mode « aucune », le
            # magasin /api/donnees répond 503 — aucune page ne peut écrire le document,
            # le plan déduit reste vide, et le partage PC/téléphone ne fonctionne pas du
            # tout. Conséquence à connaître : chaque appareil (PC, téléphone) saisit le
            # jeton une fois dans le dashboard. C'est aussi ce qui empêche n'importe
            # quelle machine du réseau d'écrire les recettes et les lots — avec un
            # document persistant, une écriture hostile ne serait plus transitoire :
            # elle détruirait durablement les relevés.
            - name: PONT_AUTH
              value: "jeton"
            # Exigé au démarrage en mode jeton : au moins 32 caractères, puisque ce jeton
            # commande des prises physiques. La clé n'est donc pas optionnelle.
            - name: PONT_JETON
              valueFrom:
                secretKeyRef:
                  name: pont-ha
                  key: PONT_JETON
            # Le pont coupe lui-même une chauffe automatique que personne n'a
            # décommandée (page fermée) : 90 minutes, puis arrêt forcé.
            - name: PONT_CHAUFFE_MAX
              value: "90"
            # Sonde muette : le pont régule lui-même, et si la sonde d'un lot ne
            # remonte plus rien depuis ce délai, il coupe la chauffe du lot au lieu
            # d'attendre les 90 minutes ci-dessus. 15 minutes : un hoquet de radio
            # dure quelques secondes, une sonde morte reste morte.
            - name: PONT_SANS_MESURE_MAX
              value: "15"
            # Le plan de régulation et l'heure des dernières commandes sont écrits ici,
            # pour survivre à un redémarrage de pod : sans cela, un pont relancé
            # repartirait sans échéance de sécurité alors qu'une chauffe est peut-être
            # en cours.
            - name: PONT_ETAT
              value: "/data/etat.json"
            # Liste blanche : le pont refuse toute commande hors de ces prises.
            - name: PONT_PRISES
              value: "switch.smart_switch_25021462413795540601c4e7ae132658_outlet_1,switch.smart_switch_25021462413795540601c4e7ae132658_outlet_2,switch.smart_switch_25021462413795540601c4e7ae132658_outlet_3,switch.smart_switch_25021462413795540601c4e7ae132658_outlet_4,switch.smart_switch_25021462413795540601c4e7ae132658_outlet_5"
            - name: PONT_SONDES
              value: "sensor.sonde_sonoff_1_temperature,sensor.sonde_sonoff_2_temperature,sensor.sonde_sonoff_3_temperature,sensor.humidity_1"
            # Correspondance explicite mesure -> batterie : les entités de batterie
            # n'ont pas de nom déductible (adresses Zigbee).
            - name: PONT_BATTERIES
              value: "sensor.sonde_sonoff_1_temperature=sensor.sonde_sonoff_1_battery,sensor.sonde_sonoff_2_temperature=sensor.0xa4c13804e325ffff_battery,sensor.sonde_sonoff_3_temperature=sensor.sonde_sonoff_3_battery,sensor.humidity_1=sensor.0x187a3efffe7aea6b_battery"
          # Le pont écoute sur la boucle locale du pod : la sonde, qui vient du réseau
          # du nœud, doit donc passer par nginx — ce qui vérifie du même coup le chemin
          # réellement emprunté par la page. Port NUMÉRIQUE obligatoire : un port nommé
          # ne se résout que dans le conteneur qui le déclare (mesuré : le kubelet répond
          # « strconv.Atoi: parsing "http": invalid syntax » et la sonde reste inconnue).
          readinessProbe:
            httpGet:
              path: /api/sante
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/sante
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: etat
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: etat
          persistentVolumeClaim:
            claimName: scada-opus-pont-etat
