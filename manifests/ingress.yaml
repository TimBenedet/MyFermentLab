# Un hôte dédié plutôt qu'un sous-chemin : l'application sert ses fichiers sous
# /assets/ et appelle /ha/ en absolu, donc la racine d'un hôte lui va sans
# configuration supplémentaire.
#
# Le nom doit être résolu par ton DNS local (ou une ligne dans /etc/hosts) vers
# 192.168.1.51 ; en attendant, le Service en NodePort 30087 donne le même accès
# par l'adresse IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fermentation-v3
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ferment.myfermentlab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fermentation-v3
                port:
                  number: 80
